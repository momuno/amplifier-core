name: "outline-generation-from-existing-doc"
description: "Generate documentation outline by analyzing existing document and discovering source files"
version: "1.0.0"
tags: ["documentation", "outline-generation", "source-analysis", "dag-validation"]

# Recipe mode: staged (includes approval gates)
# This enables human-in-loop review at critical decision points

context:
  # Required: Path to document to generate outline for
  target_doc: ""  # e.g., "docs/DESIGN_PHILOSOPHY.md"
  
  # Optional: Array of external repos to check (auto-detect if not provided)
  external_repos: []  # e.g., ["amplifier-foundation"]
  
  # Optional: Working directory for artifacts
  working_dir: ".doc-gen"

# Recursion protection
recursion:
  max_depth: 2
  max_total_steps: 100

# ==============================================================================
# STAGE 1: DOCUMENT ANALYSIS
# Purpose: Extract essence, purpose, and scope of target document
# ==============================================================================
stages:
  - name: "document-analysis"
    description: "Analyze target document to understand its purpose and scope"
    
    steps:
      - id: "validate-target-exists"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Verify that the target document exists at: {{target_doc}}
          
          Use read_file to check if the file exists and is readable.
          If it doesn't exist, report an error with the exact path that was checked.
          If it exists, report success with the file size and line count.
        output: "target_validation"
        timeout: 120
        on_error: "fail"
      
      - id: "read-target-document"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Read the complete target document: {{target_doc}}
          
          Capture the full content for analysis in subsequent steps.
        output: "target_content"
        timeout: 300
        on_error: "fail"
      
      - id: "extract-document-essence"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Analyze the target document and extract:
          
          1. **Purpose**: What is this document about? (1-2 sentences)
          2. **Scope**: What topics/concepts does it cover?
          3. **Essence**: What is the main point it communicates?
          4. **Document Type**: Is this technical reference, explanatory synthesis, or overview?
          5. **Key Sections**: List the main heading structure
          
          Document content:
          {{target_content}}
          
          Provide a concise summary that captures the document's intent.
        output: "document_analysis"
        parse_json: true
        timeout: 600
        on_error: "fail"

  # ==============================================================================
  # STAGE 2: REPOSITORY SCAN
  # Purpose: Build comprehensive understanding of all available source material
  # ==============================================================================
  - name: "repository-scan"
    description: "Scan current repository and external repos for potential source files"
    
    steps:
      - id: "find-repo-files"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Discover all files in the current repository that could be potential sources.
          
          Use glob or bash to find:
          - All markdown files (*.md)
          - Documentation files (docs/*, context/*)
          - Specification files (specs/*)
          - README files
          - Configuration files that might contain documentation
          
          Exclude:
          - node_modules/
          - .venv/
          - .git/
          - __pycache__/
          - build/
          - dist/
          - .doc-gen/
          
          Output a structured list of file paths grouped by type.
        output: "repo_file_list"
        parse_json: true
        timeout: 300
        on_error: "fail"
      
      - id: "detect-external-repos"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Detect external repositories that might contain source material.
          
          Check:
          1. User-provided repos: {{external_repos}}
          
          For each detected external repo:
          - Get the full path
          - Get the commit hash (git rev-parse HEAD)
          - List key documentation files
          
          If no external repos provided and none detected, note that and continue with current repo only.
        output: "external_repos_detected"
        parse_json: true
        timeout: 300
        on_error: "continue"
      
      - id: "get-current-repo-commit"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Get the current commit hash for this repository.
          
          Run: git rev-parse HEAD
          
          Output the full 40-character commit hash.
        output: "current_repo_commit"
        timeout: 60
        on_error: "fail"

  # ==============================================================================
  # STAGE 3: SOURCE DISCOVERY & VERIFICATION
  # Purpose: Identify and VERIFY source files through evidence-based analysis
  # Critical: Only include files that have been READ and VERIFIED to exist
  # ==============================================================================
  - name: "source-discovery"
    description: "Identify and verify source files exist before including in analysis"
    
    steps:
      - id: "verify-potential-sources-exist"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          **CRITICAL VALIDATION STEP**: Verify each potential source file exists.
          
          Files from repository scan: {{repo_file_list}}
          
          For EACH file in the list:
          1. Use read_file to attempt reading it
          2. If read succeeds → File EXISTS and is readable
          3. If read fails → File is MISSING or unreadable
          
          Create TWO separate lists:
          
          **VERIFIED_FILES** (exist and readable):
          - file_path
          - line_count (from read_file output)
          - status: "verified"
          
          **MISSING_FILES** (don't exist or unreadable):
          - file_path
          - error: "reason for failure"
          - status: "missing"
          
          **RULE**: Only files in VERIFIED_FILES can be included as sources.
          Files in MISSING_FILES must be EXCLUDED from all analysis.
          
          This is a GATING step - prevents invalid file references downstream.
        output: "file_verification_results"
        parse_json: true
        timeout: 900
        on_error: "fail"
      
      - id: "read-verified-sources"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Read the content of VERIFIED files only.
          
          Verified files: {{file_verification_results}}
          
          Use read_file on each file in the VERIFIED_FILES list.
          Do NOT attempt to read files from MISSING_FILES list.
          
          Build a comprehensive understanding of what content exists where.
          
          For each verified file, capture:
          - Full file path
          - Content summary
          - Key concepts/sections
          - Document type (spec, guide, reference, etc.)
        output: "verified_sources_content"
        timeout: 900
        on_error: "continue"
      
      - id: "report-missing-files"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Report on missing files for user awareness.
          
          Verification results: {{file_verification_results}}
          
          Extract the MISSING_FILES list and provide a summary:
          - How many files were missing
          - Which files were missing
          - Why they might be missing (recently removed, wrong path, etc.)
          
          This is informational only - missing files are already excluded.
        output: "missing_files_report"
        timeout: 180
        on_error: "continue"
      
      - id: "compare-and-identify-sources"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Compare target document to VERIFIED files only and identify sources.
          
          **CRITICAL**: Only analyze files from VERIFIED_FILES list.
          Do NOT include any files from MISSING_FILES list.
          
          Target document analysis:
          {{document_analysis}}
          
          Verified sources content:
          {{verified_sources_content}}
          
          Verification results (for reference):
          {{file_verification_results}}
          
          # ==============================================================================
          # THE INVERSE SYNTHESIS PROBLEM
          # ==============================================================================
          
          **Core Principle**: Think about the INVERSE of synthesis.
          
          When a document synthesizes content from sources, it:
          - Combines multiple perspectives
          - Abstracts from concrete to conceptual
          - Unifies different terminology into consistent language
          - Creates new explanations from existing material
          
          Your task is the INVERSE: Given synthesized content, identify what sources
          were likely combined to create it.
          
          **DO NOT just look for keyword matches!**
          
          Sources may use completely different terminology but contain the conceptual
          material that was synthesized. For example:
          - Document says "kernel-like architecture" 
            → Sources might discuss "modular design", "contracts", "protocols", "interfaces"
          - Document says "regeneration-friendly"
            → Sources might describe "idempotent", "declarative", "stateless"
          - Document explains a synthesized principle
            → Sources contain the raw examples, specs, and implementation details
          
          # ==============================================================================
          # KEY QUESTIONS FOR SOURCE DISCOVERY (Answer these for each section)
          # ==============================================================================
          
          For each section in the target document, ask:
          
          1. **"What is this section really about?"** (conceptual level, not just keywords)
             - What core concepts are being explained?
             - What mental model is being constructed?
             - What understanding is being built?
          
          2. **"What source materials would an author need to synthesize this content?"**
             - What foundational knowledge is required?
             - What examples or concrete instances inform this?
             - What specifications or contracts are referenced?
             - What philosophical/design principles underlie this?
          
          3. **"What different perspectives/sources might contribute to this synthesis?"**
             - Philosophy/rationale documents (the "WHY")
             - Specifications/contracts (the "WHAT")
             - Implementation examples (the "HOW")
             - Process/workflow documentation (the "WHEN/WHERE")
             - Reference documentation (the "DETAILS")
          
          4. **"Are there examples, specs, or implementation docs that inform this?"**
             - Code examples that demonstrate concepts
             - Specifications that define behaviors
             - Implementation files that show patterns
             - Test files that clarify expectations
          
          # ==============================================================================
          # INVERSE SYNTHESIS EXAMPLES
          # ==============================================================================
          
          **Example 1: Architectural Philosophy Section**
          
          Target document content:
          "Amplifier's modular design enables rapid regeneration by treating each 
          module as an independent unit with stable interfaces."
          
          WRONG approach (lexical matching):
          → Search for files containing "modular design", "regeneration", "interfaces"
          
          RIGHT approach (inverse synthesis):
          → Ask: "What sources would I need to write this statement?"
          → Identify conceptual materials:
             - MODULAR_DESIGN_PHILOSOPHY.md (explains the "why" of modularity)
             - module_protocol.py (defines the "what" - actual interfaces/contracts)
             - example_modules/ (shows the "how" - concrete implementations)
             - REGENERATION_GUIDE.md (explains the regeneration process)
             - interface_contracts.md (specifies stability guarantees)
          
          These sources might use terms like "bricks", "contracts", "protocols", "composable",
          "idempotent" instead of the exact words in the target document, but they contain
          the raw material that was synthesized into the statement.
          
          **Example 2: Technical Concept Explanation**
          
          Target document content:
          "The discovery protocol validates sources through pattern matching and 
          file existence checks."
          
          WRONG approach:
          → Look for files mentioning "discovery protocol", "pattern matching"
          
          RIGHT approach:
          → Ask: "What implementation details inform this explanation?"
          → Identify sources:
             - discovery.py (implementation of the discovery mechanism)
             - validation.py (implementation of validation checks)
             - SOURCE_PATTERNS configuration (the actual patterns)
             - tests/test_discovery.py (shows validation behavior)
             - error_handling.md (explains validation failures)
          
          The implementation might use function names like `find_modules()` or 
          `check_source_validity()` instead of "discovery protocol", but these
          are the sources that enable explaining the protocol.
          
          # ==============================================================================
          # MULTI-PERSPECTIVE SOURCE ANALYSIS
          # ==============================================================================
          
          For EACH section in the target document, identify sources across these types:
          
          **1. PHILOSOPHY / RATIONALE (The "WHY")**
          - Design philosophy documents
          - Architecture decision records
          - Principle explanations
          - Motivation documents
          - Vision/mission statements
          
          **2. SPECIFICATIONS / CONTRACTS (The "WHAT")**
          - Protocol definitions
          - Interface specifications
          - API contracts
          - Data structure specs
          - Behavior definitions
          
          **3. IMPLEMENTATION / EXAMPLES (The "HOW")**
          - Source code files
          - Example implementations
          - Reference implementations
          - Code patterns
          - Utility functions
          
          **4. PROCESS / WORKFLOWS (The "WHEN/WHERE")**
          - Process documentation
          - Workflow descriptions
          - Usage guides
          - Integration guides
          - Best practices
          
          **5. REFERENCE / DETAILS (The "DETAILS")**
          - Technical reference docs
          - API documentation
          - Configuration options
          - Error catalogs
          - Troubleshooting guides
          
          **6. TESTS / VALIDATION (The "PROOF")**
          - Test files that demonstrate behavior
          - Test cases that show expectations
          - Validation examples
          - Contract tests
          
          # ==============================================================================
          # DISCOVERY METHODOLOGY
          # ==============================================================================
          
          For each VERIFIED file, perform this analysis:
          
          **Step 1: Conceptual Analysis**
          - What concepts does this file contain?
          - What knowledge does it convey?
          - What perspective does it provide? (why/what/how/when/details)
          
          **Step 2: Synthesis Mapping**
          - Which sections of the target document could be synthesized from this?
          - What explanations in the target draw from this file's content?
          - Could an author have used this file as source material?
          
          **Step 3: Evidence Collection**
          - Verbatim matches (direct text reuse)
          - Conceptual alignment (same ideas, different words)
          - Structural similarity (same organization pattern)
          - Examples referenced (specific instances cited)
          - Implementations demonstrated (code patterns shown)
          - Terminology variants (different words, same meaning)
          
          **Step 4: Confidence Assessment**
          Consider:
          - How central is this file's content to the target section?
          - Could the section be written without this file?
          - Does this file provide unique information?
          - Are there clear conceptual connections?
          
          # ==============================================================================
          # TERMINOLOGY VARIATION AWARENESS
          # ==============================================================================
          
          **CRITICAL**: Sources may use DIFFERENT terminology for the SAME concepts.
          
          Common variations to watch for:
          - "modules" ↔ "bricks" ↔ "components" ↔ "units"
          - "interfaces" ↔ "contracts" ↔ "protocols" ↔ "APIs"
          - "discovery" ↔ "detection" ↔ "finding" ↔ "locating"
          - "validation" ↔ "verification" ↔ "checking" ↔ "ensuring"
          - "regeneration" ↔ "rebuilding" ↔ "recreation" ↔ "reconstruction"
          
          Look for conceptual matches, not just lexical matches.
          
          # ==============================================================================
          # SOURCE CATEGORIZATION
          # ==============================================================================
          
          Categorize sources by confidence AND by type:
          
          **Confidence Levels**:
          - **Very High**: Verbatim text matches + Strong conceptual alignment
          - **High**: Clear conceptual alignment + Supporting evidence
          - **Medium**: Related concepts that likely informed the synthesis
          - **Should Include**: Conceptually relevant but indirect contribution
          
          **Evidence Types** (can have multiple):
          - verbatim_match: Direct text reuse
          - conceptual_alignment: Same ideas, different expression
          - structural_parallel: Similar organization
          - example_source: Concrete instances cited
          - implementation_basis: Code patterns demonstrated
          - philosophical_foundation: Underlying principles explained
          - specification_basis: Contracts/protocols defined
          
          # ==============================================================================
          # OUTPUT FORMAT
          # ==============================================================================
          
          For each identified source, document:
          
          ```yaml
          - file: "path/to/source.md"
            verification_status: "verified-exists"
            confidence: "very-high|high|medium|should-include"
            source_type: "philosophy|specification|implementation|process|reference|test"
            evidence_types: ["verbatim_match", "conceptual_alignment", ...]
            contributes_to_sections: ["Section Name 1", "Section Name 2"]
            synthesis_reasoning: |
              Explain the INVERSE SYNTHESIS reasoning:
              - What concepts from this source appear in the target?
              - How was this source's content likely synthesized?
              - What terminology variations exist between source and target?
              - Why would an author need this source to write the target?
          ```
          
          **OUTPUT CONSTRAINT**: Only include files that were successfully verified.
          If a file appears relevant but is in MISSING_FILES, note it separately
          as "suggested-but-missing" for user awareness.
          
          # ==============================================================================
          # QUALITY CHECK
          # ==============================================================================
          
          Before finalizing, verify:
          - [ ] Have I considered ALL types of sources (philosophy, specs, impl, process, etc.)?
          - [ ] Have I looked beyond keyword matches to conceptual connections?
          - [ ] Have I identified sources that use different terminology?
          - [ ] Have I asked "what would an author need to write this?" for each section?
          - [ ] Have I mapped both direct and synthesized content?
          - [ ] Am I capturing the full breadth of source material used?
        output: "source_analysis"
        parse_json: true
        timeout: 1200
        on_error: "fail"
      
      - id: "verify-external-sources-exist"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          **CRITICAL VALIDATION**: Verify external repository files exist.
          
          External repos detected: {{external_repos_detected}}
          
          If no external repos were detected, output empty lists and continue.
          
          For each external repo file:
          1. Use read_file to verify it exists
          2. If read succeeds → File EXISTS
          3. If read fails → File is MISSING
          
          Create TWO lists:
          
          **VERIFIED_EXTERNAL_FILES**:
          - file_path
          - repository
          - status: "verified"
          
          **MISSING_EXTERNAL_FILES**:
          - file_path
          - repository
          - error: "reason"
          - status: "missing"
          
          Only verified external files can be included as sources.
        output: "external_file_verification"
        parse_json: true
        timeout: 600
        on_error: "continue"
      
      - id: "read-verified-external-sources"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Read VERIFIED external repository files only.
          
          External verification: {{external_file_verification}}
          Target document analysis: {{document_analysis}}
          
          For each file in VERIFIED_EXTERNAL_FILES:
          1. Read the content
          2. Compare to target document
          3. Identify philosophical/foundational content that appears in target
          
          Cross-repository synthesis is common for explanatory documents.
          Look for foundation concepts, design patterns, architectural principles.
          
          **OUTPUT**: Only include files that were successfully verified.
          Do NOT include files from MISSING_EXTERNAL_FILES list.
          
          If no external repos or all missing, output empty analysis.
        output: "external_source_analysis"
        timeout: 900
        on_error: "continue"
      
      - id: "create-initial-source-list"
        agent: "foundation:zen-architect"
        mode: "ARCHITECT"
        prompt: |
          Create the initial comprehensive source list from VERIFIED files only.
          
          **CRITICAL VALIDATION**: Only include files that were verified to exist.
          
          Input data:
          - Current repository sources: {{source_analysis}}
          - External repository sources: {{external_source_analysis}}
          - File verification results: {{file_verification_results}}
          - External verification results: {{external_file_verification}}
          
          **RULE**: Every file in the source list MUST have been verified to exist.
          Cross-reference each file against the VERIFIED_FILES lists.
          
          For each source:
          ```yaml
          - file: "path/to/file"
            repository: "repo-name"
            commit: "commit-hash"
            confidence: "very-high|high|medium"
            evidence: "Description of matching content"
            supports_sections: ["section1", "section2"]
            verification_status: "verified-exists"
          ```
          
          If the source analysis included any files that are NOT in the verified lists,
          create a separate section:
          ```yaml
          suggested_but_missing:
            - file: "path/to/missing/file"
              reason: "File was suggested but doesn't exist"
              note: "Referenced in target doc but file is missing"
          ```
          
          Output as structured YAML.
          
          **GUARANTEE**: All files in the main source list have been read and verified.
        output: "initial_source_list"
        parse_json: true
        timeout: 600
        on_error: "fail"

  # ==============================================================================
  # STAGE 4: CIRCULAR REFERENCE DETECTION (APPROVAL GATE)
  # Purpose: Ensure source tree is a DAG with no cycles
  # ==============================================================================
  - name: "circular-detection"
    description: "Detect and exclude circular references to maintain DAG structure"
    approval_required: true
    
    steps:
      - id: "find-references-to-target"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Find all documents that reference the target document.
          
          Target: {{target_doc}}
          
          Search the repository for files that link to or reference this document:
          - Use grep to find mentions of the filename
          - Check README.md, index files, navigation docs
          - Look for markdown links like [text]({{target_doc}})
          
          Output a list of files that reference the target.
        output: "referencing_documents"
        timeout: 300
        on_error: "continue"
      
      - id: "analyze-abstraction-hierarchy"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Analyze the abstraction hierarchy to determine document levels.
          
          Target document: {{target_doc}}
          Document analysis: {{document_analysis}}
          Documents referencing target: {{referencing_documents}}
          Initial source list: {{initial_source_list}}
          
          For each document that references the target:
          - Is it HIGHER level (overview, README, index)?
          - Is it LOWER level (detailed spec, implementation)?
          
          **Rule**: Higher-level docs CANNOT be sources for lower-level docs.
          
          If a document links TO the target:
          - The referring document is HIGHER in the tree
          - It abstracts/summarizes content FROM the target
          - It CANNOT be a source FOR the target (would create cycle)
          
          Build dependency hierarchy:
          ```
          Top-level (README, overview)
              ↓ reference/abstract
          Mid-level (explanatory docs, synthesis)
              ↓ reference/derive
          Leaf-level (specs, code, foundational docs)
          ```
        output: "hierarchy_analysis"
        parse_json: true
        timeout: 600
        on_error: "fail"
      
      - id: "identify-circular-references"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Identify circular references that must be excluded.
          
          Hierarchy analysis: {{hierarchy_analysis}}
          Initial sources: {{initial_source_list}}
          
          For each source in the initial list:
          - Does it reference the target document?
          - Is it higher in the abstraction tree?
          - Would using it as a source create a cycle?
          
          Create exclusion list with detailed reasoning for each exclusion:
          ```yaml
          exclusions:
            - file: "path/to/file"
              reason: "References target document - higher in abstraction tree"
              evidence: "Contains link to {{target_doc}}"
              hierarchy_level: "top-level"
          ```
          
          **IMPORTANT**: This exclusion list will be presented to the user for approval.
          Provide clear, evidence-based reasoning for each exclusion.
        output: "circular_exclusion_list"
        parse_json: true
        timeout: 600
        on_error: "fail"
      
      - id: "create-validated-source-list"
        agent: "foundation:zen-architect"
        mode: "ARCHITECT"
        prompt: |
          Create the validated source list with circular references removed.
          
          Initial sources: {{initial_source_list}}
          Exclusions: {{circular_exclusion_list}}
          
          Remove excluded files and create final source list.
          
          For each remaining source:
          - Verify no circular references
          - Confirm hierarchy is valid (source at same or lower level)
          - Document why it's included
          
          Output structured source list ready for source tree creation.
        output: "validated_source_list"
        parse_json: true
        timeout: 300
        on_error: "fail"
      
      - id: "present-exclusions-for-approval"
        agent: "foundation:zen-architect"
        mode: "REVIEW"
        prompt: |
          Present the circular reference analysis for user review.
          
          **Exclusion Summary**:
          {{circular_exclusion_list}}
          
          **Validated Source List**:
          {{validated_source_list}}
          
          **Hierarchy Analysis**:
          {{hierarchy_analysis}}
          
          Please review:
          1. Are the exclusions correct?
          2. Are there any sources that should be excluded but aren't?
          3. Is the abstraction hierarchy analysis accurate?
          
          Provide a clear summary that explains:
          - Why each file was excluded (circular reference, hierarchy violation)
          - The final source count
          - The dependency structure
          
          Format this for easy review and approval.
        output: "approval_summary"
        timeout: 300
        on_error: "fail"

  # ==============================================================================
  # STAGE 5: SOURCE TREE CREATION
  # Purpose: Create machine-readable record of source dependencies
  # ==============================================================================
  - name: "source-tree"
    description: "Create source tree YAML documenting the dependency DAG"
    
    steps:
      - id: "extract-document-metadata"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Extract metadata for the source tree.
          
          Target document: {{target_doc}}
          Document analysis: {{document_analysis}}
          Hierarchy: {{hierarchy_analysis}}
          
          Extract:
          - Document path
          - Document type (mid-level-synthesis, leaf-node, top-level-overview)
          - Purpose (brief description)
          - Scope (what it covers)
          - Referenced by (higher-level docs)
          - References to (docs it links to)
        output: "document_metadata"
        parse_json: true
        timeout: 300
        on_error: "fail"
      
      - id: "build-source-tree-yaml"
        agent: "foundation:zen-architect"
        mode: "ARCHITECT"
        prompt: |
          Build the source tree YAML file.
          
          Document metadata: {{document_metadata}}
          Validated sources: {{validated_source_list}}
          Exclusions: {{circular_exclusion_list}}
          Current repo commit: {{current_repo_commit}}
          External repos: {{external_repos_detected}}
          
          Structure:
          ```yaml
          document:
            path: "{{target_doc}}"
            type: "mid-level-synthesis"  # or leaf-node, top-level-overview
            purpose: "Brief description"
            scope: "What it covers"
            referenced_by: [list of higher-level docs]
            references_to: [list of docs it links to]
          
          sources:
            - file: "path/to/source.md"
              repository: "repo-name"
              url: "https://github.com/org/repo/blob/COMMIT/path"
              commit: "full-commit-hash"
              type: "leaf"  # or mid-level
              contributes: ["concept", "section", "foundation"]
              evidence: "Why this file is a source"
          
          circular_analysis:
            excluded:
              - file: "path/to/excluded"
                reason: "Higher in abstraction tree - would create cycle"
                evidence: "Links to target document"
            
            validation_rules:
              - "No circular references in dependency tree"
              - "Information flows upward, references flow downward"
              - "Source files at same or lower abstraction level"
          
          dependency_tree: |
            [Create ASCII visualization of the dependency structure]
          
          generated:
            date: "[Use current timestamp: $(date -Iseconds)]"
            recipe_version: "1.0.0"
            current_commit: "{{current_repo_commit}}"
          ```
          
          Ensure all commit hashes are full 40-character hashes.
        output: "source_tree_yaml"
        timeout: 600
        on_error: "fail"
      
      - id: "write-source-tree-file"
        agent: "foundation:zen-architect"
        mode: "ARCHITECT"
        prompt: |
          Write the source tree to the file system.
          
          Extract the document name from: {{target_doc}}
          - If path is "docs/DESIGN_PHILOSOPHY.md", name is "DESIGN_PHILOSOPHY"
          
          Target file: {{working_dir}}/source-trees/{DOC_NAME}.yaml
          
          Content: {{source_tree_yaml}}
          
          Use write_file to create the source tree YAML.
          Create the directory if it doesn't exist.
        output: "source_tree_path"
        timeout: 300
        on_error: "fail"

  # ==============================================================================
  # STAGE 6: OUTLINE GENERATION
  # Purpose: Create structured JSON outline mapping sections to sources
  # ==============================================================================
  - name: "outline-generation"
    description: "Generate the final outline JSON with section-to-source mappings"
    
    steps:
      - id: "read-outline-examples"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Read example outlines to understand the required structure.
          
          Read these files if they exist:
          - .doc-gen/examples/sample-outline.json
          - .doc-gen/examples/hooks_outline.json
          
          Extract:
          - Required fields (meta, document, sections)
          - Section schema (heading, level, prompt, sources)
          - Source format (file URL, reasoning, commit)
          - Nesting structure for subsections
          
          If examples don't exist, use this schema:
          ```json
          {
            "meta": {
              "name": "document-name",
              "model": "claude-sonnet-4",
              "temperature": 0.7,
              "max_tokens": 8000,
              "document_instruction": "Overall guidance for document generation"
            },
            "document": {
              "title": "Document Title",
              "output": "path/to/output.md",
              "sections": [...]
            }
          }
          ```
        output: "outline_schema"
        timeout: 300
        on_error: "continue"
      
      - id: "extract-heading-structure"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Extract the heading structure from the target document.
          
          Target content: {{target_content}}
          
          Use grep or text parsing to find all headings (lines starting with #).
          Parse the hierarchy:
          - # = level 1
          - ## = level 2
          - ### = level 3
          - etc.
          
          Create a hierarchical structure showing:
          - Heading text
          - Level
          - Position in document
          - Parent section (for nesting)
          
          Output as structured data ready for outline generation.
        output: "heading_structure"
        parse_json: true
        timeout: 300
        on_error: "fail"
      
      - id: "map-sections-to-sources"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Map each section to its source files.
          
          Heading structure: {{heading_structure}}
          Source analysis: {{source_analysis}}
          Validated sources: {{validated_source_list}}
          
          For each section:
          1. Identify which source files contain relevant content
          2. Determine what each source contributes to this section
          3. Write reasoning for why each source is included
          4. Assign confidence/evidence level
          
          Use the evidence from source discovery phase.
          
          Output: Section → Sources mapping with reasoning
        output: "section_source_mapping"
        parse_json: true
        timeout: 900
        on_error: "fail"
      
      - id: "create-section-prompts"
        agent: "foundation:zen-architect"
        mode: "ARCHITECT"
        prompt: |
          Create INSTRUCTION-FOCUSED prompts for each section.
          
          Heading structure: {{heading_structure}}
          Section-source mapping: {{section_source_mapping}}
          Document analysis: {{document_analysis}}
          
          **CRITICAL**: Generate prompts that tell HOW to synthesize, NOT WHAT specific content to include.
          
          Prompts should be INSTRUCTION SETS that enable the agent to DISCOVER and SYNTHESIZE
          relevant material from sources. They should NOT prescribe specific content, concepts,
          metaphors, or examples that lock in current source material.
          
          **Core Principle**:
          ```
          Prompts = Instructions for synthesis + Structural templates
          Prompts ≠ Content specifications + Count locks
          
          Structure (HOW to present) = ENCOURAGED ✅
          Content/Count (WHAT/HOW MANY items) = PROHIBITED ❌
          ```
          
          **Key Distinction**:
          
          **TEMPLATES & STRUCTURE** (Encouraged ✅):
          - Table formats, column specifications
          - Section organization patterns
          - Presentation structures (lists, prose, examples)
          - Style and tone requirements
          
          **CONTENT & COUNT LOCKS** (Prohibited ❌):
          - Specific items to include
          - Predetermined numbers ("three principles", "four scenarios")
          - Named concepts/metaphors
          - Exact examples or implementations
          
          **Design Principles**:
          
          1. **Structural Templates Are GOOD**
             ✅ "Create a table covering name, association, and use case for the different scenarios"
                → Specifies TABLE STRUCTURE (columns: name, association, use case)
                → Says "different scenarios" (discovered from sources)
                → Count and content come from source files
             
             ✅ "Present the principles as a numbered list with brief explanations"
                → Specifies PRESENTATION FORMAT (numbered list with explanations)
                → Says "the principles" (discovered from sources)
                → Doesn't lock which or how many principles
             
             ❌ "Create a table for the three scenarios: X, Y, and Z"
                → Locks COUNT ("three")
                → Locks CONTENT (names specific scenarios X, Y, Z)
             
             ❌ "List the four core principles: mechanism vs policy, ruthless simplicity, composability, and observability"
                → Locks COUNT ("four")
                → Locks CONTENT (names specific principles)
          
          2. **Abstract Instructions, Not Content Prescriptions**
             ✅ "Identify the central organizing principle from the philosophy sources"
             ❌ "Include the Linux kernel metaphor as the central organizing principle"
             
             ✅ "Synthesize the key design themes that emerge from the sources"
             ❌ "Include mechanism vs policy, modular design, and ruthless simplicity"
             
             The agent should DISCOVER "Linux kernel metaphor" and "mechanism vs policy" 
             from the sources - not be TOLD to include them.
          
          3. **Conceptual Categories, Not Specific Content**
             ✅ "Explain the discovery mechanism and how it validates sources"
             ❌ "Explain the discover_sources() function from lines 100-115"
             
             ✅ "Describe the architectural principles that guide the design"
             ❌ "Describe mechanism vs policy and separation of concerns"
          
          4. **Structural Guidance, Not Locked Examples**
             ✅ "Include code examples that illustrate the key patterns"
             ✅ "Present each pattern with: name, purpose, example, and use cases"
                → Specifies STRUCTURE for presenting patterns
                → Doesn't lock which patterns or how many
             
             ❌ "Show the ModuleSource class definition from lines 15-25"
             ❌ "Include examples for strategy, observer, and factory patterns"
                → Locks specific patterns
          
          5. **Process Instructions, Not Content Requirements**
             ✅ "Describe how the protocol ensures validity"
             ❌ "Describe the validate_sources() function that checks SOURCE_PATTERNS"
             
             ✅ "Explain the validation approach and its guarantees"
             ❌ "Explain that validation uses regex patterns and file existence checks"
          
          6. **Future-Proof Synthesis Guidance**
             ✅ "Synthesize the core principles from the philosophy sources"
             ✅ "Present each principle with: name, description, and rationale"
                → Specifies STRUCTURE for presenting principles
                → Doesn't lock which principles or how many
             
             ❌ "Include the three principles listed in DESIGN_PHILOSOPHY.md"
                → Locks COUNT ("three")
                → Locks SOURCE location
             
             ✅ "Extract and organize the key themes that appear across sources"
             ✅ "For each theme, provide: definition, examples, and implications"
                → Specifies STRUCTURE for presenting themes
                → Doesn't lock which themes, how many, or ordering
             
             ❌ "Cover theme A, theme B, and theme C in that order"
                → Locks CONTENT (specific themes)
                → Locks COUNT (three themes)
                → Locks ORDER
          
          7. **Context Flow (Good - This Helps Structure)**
             ✅ "Building on the overview from the previous section..."
             ✅ "This sets the foundation for the validation rules section that follows"
          
          **Real-World Example Transformation**:
          
          BEFORE (Too Prescriptive - Locks In Content/Count):
          ```
          Establish the document's purpose and provide a compelling overview of 
          Amplifier's architectural philosophy. Include: (1) High-level statement 
          of Amplifier's design philosophy, (2) The Linux kernel metaphor as 
          central organizing principle, (3) Preview of key themes: mechanism vs 
          policy, modular design, ruthless simplicity, (4) How this philosophy 
          enables AI-native development and regeneration.
          ```
          
          AFTER (Instruction-Focused + Structural Templates):
          ```
          Establish the document's purpose and provide a compelling overview of 
          Amplifier's architectural philosophy.
          
          Include:
          - High-level statement of the design philosophy
          - Identify and explain the central organizing principle
          - Preview the key design themes that emerge from the sources
          - Explain how this philosophy enables AI-native development and regeneration
          
          Style: Engaging and accessible overview
          Tone: Compelling but grounded, suitable for technical readers
          Structure: Clear prose with conceptual progression
          
          Synthesize from the philosophy sources provided.
          ```
          
          Notice: The AFTER version:
          - Lets the agent DISCOVER "Linux kernel metaphor" and "mechanism vs policy" from sources
          - Specifies STRUCTURE (how to present: statement, principle, themes, explanation)
          - Doesn't lock CONTENT (what specific principle or themes)
          - Doesn't lock COUNT (how many themes)
          - If sources evolve, the outline remains valid
          
          **Table Example - Structure vs Content**:
          
          ✅ GOOD (Structural Template):
          ```
          Create a comparison table with columns: Feature, Description, Benefits, Trade-offs.
          Populate with the key features discovered in the sources.
          ```
          → Specifies TABLE STRUCTURE (4 columns with clear purposes)
          → Says "key features discovered" (from sources, not predetermined)
          → Agent determines which features and how many
          
          ❌ BAD (Content/Count Lock):
          ```
          Create a comparison table showing the three features: modularity, 
          composability, and observability, with their descriptions and benefits.
          ```
          → Locks COUNT ("three features")
          → Locks CONTENT (specific features named)
          → Breaks regeneration when sources add/remove/rename features
          
          **Prompt Template Structure**:
          
          Each prompt should follow this structure:
          ```
          [What to accomplish]: Brief description of section purpose
          
          [What to include]:
          - Category of information to synthesize (NOT specific content)
          - Type of explanation needed (NOT exact points to make)
          - Relationships to explore (NOT predetermined connections)
          
          [How to present it] (Structural Templates - ENCOURAGED):
          - Format: [table with columns X, Y, Z | numbered list | prose | code examples]
          - Organization: [comparison table | hierarchical list | conceptual flow]
          - Elements per item: [name + description | title + example + rationale]
          
          [How to write it]:
          - Style: [technical/explanatory/overview/specification]
          - Tone: [accessible/formal/conversational/precise]
          - Structure: [prose/lists/examples/mixed]
          
          [Context]:
          - Previous section: [relationship to previous content]
          - Next section: [what this enables for following content]
          
          Synthesize from the sources provided.
          ```
          
          Note: "How to present it" specifies STRUCTURE (template), which is encouraged.
          It should NOT specify WHAT items or HOW MANY items - those come from sources.
          
          **Required Elements for Each Prompt**:
          
          1. **Section Purpose**: What this section accomplishes (abstract goal)
          2. **Content Categories**: TYPES of information to discover (not specific items)
          3. **Synthesis Instructions**: HOW to analyze and organize (not what to say)
          4. **Presentation Structure**: Templates for HOW to present (encouraged ✅)
             - Table formats with column specifications
             - List structures with element types
             - Organization patterns (comparison, hierarchical, chronological)
          5. **Style Guidance**: How to write (technical/explanatory/etc.)
          6. **Tone Specification**: Voice and audience level
          7. **Context Flow**: Links to previous/next sections
          8. **Generic Source Reference**: "Synthesize from sources" (never specific files/lines)
          
          **Prohibited in Prompts** (STRICT - These Break Regeneration):
          
          ❌ **Content Prescriptions**:
          - Specific metaphors/analogies by name ("Linux kernel metaphor")
          - Specific principles by name ("mechanism vs policy", "ruthless simplicity")
          - Predetermined themes or concepts ("include X, Y, and Z")
          - Exact examples to use ("the git remote example")
          - Specific terminology that may evolve ("bundles", "providers")
          
          ❌ **Count Locks**:
          - Exact counts ("the three principles", "four main points", "five scenarios")
          - Numbered prescriptions ("include (1) X, (2) Y, (3) Z")
          - "All N items" formulations ("all seven patterns")
          
          ❌ **Implementation Locks**:
          - Line numbers (e.g., "lines 45-60")
          - Specific function/class names ("discover_sources()", "ModuleSource")
          - File-specific references ("from DESIGN_PHILOSOPHY.md")
          - Current implementation details ("checks SOURCE_PATTERNS")
          
          ❌ **Content-Specific Ordering**:
          - Predetermined content order ("cover A, then B, then C" where A/B/C are specific items)
          - "First X, then Y, then Z" (when X/Y/Z are named content items)
          - Specific section names from current sources ("the 'Core Concepts' section")
          
          **What IS Allowed** (These Guide Synthesis):
          
          ✅ **Abstract Instructions**:
          - "Identify the central organizing principle"
          - "Synthesize the key design themes"
          - "Explain the validation approach"
          - "Describe the discovery mechanism"
          
          ✅ **Conceptual Categories**:
          - "Architectural principles that guide the design"
          - "Core data structures and their relationships"
          - "Error handling strategy and guarantees"
          - "Integration patterns and extension points"
          
          ✅ **Synthesis Directives**:
          - "Extract and organize the themes that appear across sources"
          - "Identify patterns in how validation is performed"
          - "Compare approaches and synthesize best practices"
          - "Build a coherent explanation from the source material"
          
          ✅ **Structural Templates** (ENCOURAGED):
          - "Create a table with columns: Name, Purpose, Example, Trade-offs"
          - "Present each pattern as: Title, Problem, Solution, Consequences"
          - "Organize as a comparison matrix showing: Feature vs Approach A vs Approach B"
          - "Format as a numbered list with: Principle statement, Explanation, Rationale"
          - "Use a hierarchical structure: Category → Subcategories → Examples"
          - "Present in chronological order: Discovery → Validation → Usage"
          - "Structure each entry with: Definition, Code example, Use cases"
          
          ✅ **Presentation Ordering** (when describing HOW, not WHAT):
          - "Present from most general to most specific"
          - "Organize by conceptual dependency (foundation → building blocks → composition)"
          - "Structure chronologically (lifecycle stages, processing pipeline)"
          - "Order by frequency of use (common patterns first)"
          - These describe HOW to order discovered content, not WHAT specific items to order
          
          **Why This Matters**:
          
          Content-prescriptive prompts break regeneration because:
          1. Sources evolve: "mechanism vs policy" might become "interface vs implementation"
          2. New content appears: A better metaphor might emerge in updated sources
          3. Examples change: Code refactors make specific function names obsolete
          4. Structure shifts: Sections reorganize, making specific references invalid
          
          Instruction-focused prompts enable regeneration because:
          1. They describe WHAT TO LOOK FOR, not what to include
          2. Agent discovers current, relevant content from sources
          3. Outline remains valid as sources evolve
          4. New relevant material is automatically included
          
          **Quality Check**:
          
          For each prompt you generate, ask:
          - "If the source files change, would this prompt still make sense?" (Should be YES)
          - "Does this tell the agent WHAT to find or HOW to synthesize?" (Should be HOW)
          - "Could new relevant material be excluded because of this wording?" (Should be NO)
          - "Am I prescribing content or instructing synthesis?" (Should be INSTRUCTING)
          
          For each section in the heading structure, generate a prompt following 
          these principles. The prompts should guide content synthesis and discovery, 
          not dictate specific content to include.
          
          Output: Prompts for each section (instruction-focused, discovery-enabling, future-proof)
        output: "section_prompts"
        parse_json: true
        timeout: 900
        on_error: "fail"
      
      - id: "build-outline-json"
        agent: "foundation:zen-architect"
        mode: "ARCHITECT"
        prompt: |
          Build the complete outline JSON.
          
          Schema: {{outline_schema}}
          Heading structure: {{heading_structure}}
          Section-source mapping: {{section_source_mapping}}
          Section prompts: {{section_prompts}}
          Current commit: {{current_repo_commit}}
          External repos: {{external_repos_detected}}
          Document metadata: {{document_metadata}}
          
          Structure:
          ```json
          {
            "meta": {
              "name": "document-name",
              "model": "claude-sonnet-4",
              "temperature": 0.7,
              "max_tokens": 8000,
              "document_instruction": "Generate this document based on the source materials..."
            },
            "document": {
              "title": "Document Title",
              "output": "{{target_doc}}",
              "sections": [
                {
                  "heading": "Section Title",
                  "level": 1,
                  "prompt": "Prompt for this section...",
                  "sources": [
                    {
                      "file": "https://github.com/org/repo/blob/COMMIT/path/file.md",
                      "reasoning": "This file provides...",
                      "commit": "full-40-char-hash"
                    }
                  ],
                  "sections": [nested subsections...]
                }
              ]
            }
          }
          ```
          
          Ensure:
          - All commit hashes are full 40-character
          - Source URLs are properly formatted GitHub blob URLs
          - Prompts are instruction-focused and discovery-enabling (not content-prescriptive)
          - Nested sections properly represented
          - All required fields present
        output: "outline_json"
        timeout: 900
        on_error: "fail"
      
      - id: "write-outline-file"
        agent: "foundation:zen-architect"
        mode: "ARCHITECT"
        prompt: |
          Write the outline JSON to the file system.
          
          Extract document name from: {{target_doc}}
          Convert to snake_case for filename (e.g., "design_philosophy")
          
          Target file: .doc-gen/outlines/{doc_name}_outline.json
          
          Content: {{outline_json}}
          
          Use write_file to create the outline JSON.
          Create directories if they don't exist.
        output: "outline_path"
        timeout: 300
        on_error: "fail"

  # ==============================================================================
  # STAGE 7: VALIDATION
  # Purpose: Validate all outputs and verify correctness
  # ==============================================================================
  - name: "validation"
    description: "Validate generated artifacts and verify correctness"
    
    steps:
      - id: "validate-json-structure"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Validate the outline JSON structure.
          
          Outline path: {{outline_path}}
          
          Use bash to validate JSON:
          ```bash
          python3 -m json.tool {{outline_path}} > /dev/null && echo "✓ Valid JSON" || echo "✗ Invalid JSON"
          ```
          
          Check:
          - Valid JSON syntax
          - All required fields present
          - No empty prompts
          - All sources have file, reasoning, commit
        output: "json_validation"
        timeout: 180
        on_error: "fail"
      
      - id: "count-sections"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Count sections in the outline and verify completeness.
          
          Outline: {{outline_path}}
          Original heading count: {{heading_structure}}
          
          Use Python to count total sections (including nested):
          ```python
          import json
          with open('{{outline_path}}') as f:
              outline = json.load(f)
          def count(sections):
              return len(sections) + sum(count(s.get('sections', [])) for s in sections)
          total = count(outline['document']['sections'])
          print(f"Total sections: {total}")
          ```
          
          Verify section count matches heading count from original document.
        output: "section_count"
        timeout: 120
        on_error: "continue"
      
      - id: "verify-source-files-exist"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          **FINAL SANITY CHECK**: Verify all source files exist (should be ZERO missing).
          
          Outline: {{outline_path}}
          Source tree: {{source_tree_path}}
          
          **EXPECTED RESULT**: All files should exist because they were verified in Stage 3.
          
          For each source file referenced in the outline and source tree:
          1. Extract file path from GitHub URL
          2. Use read_file to verify it exists
          3. Verify commit hash is valid (git cat-file -e COMMIT)
          
          If ANY files are missing:
          - This is a CRITICAL RECIPE BUG
          - Stage 3 verification failed to catch these
          - Report as ERROR, not warning
          
          Expected: 0 missing files
          If found: Report as critical failure
          
          **SUCCESS CRITERIA**: 
          - All files exist: ✅ Stage 3 verification worked correctly
          - Any missing files: ❌ RECIPE BUG - Stage 3 verification incomplete
          
          Note: Files from external repos should be checked in their cache locations.
        output: "file_existence_check"
        timeout: 300
        on_error: "fail"
      
      - id: "verify-no-circular-references"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Final check for circular references.
          
          Source tree: {{source_tree_yaml}}
          Exclusions: {{circular_exclusion_list}}
          
          Verify:
          - No source file references the target document
          - Dependency tree is acyclic (DAG)
          - All exclusions were properly applied
          
          If any circular references found, report as error.
        output: "circular_check"
        timeout: 180
        on_error: "fail"
      
      - id: "generate-validation-report"
        agent: "foundation:zen-architect"
        mode: "REVIEW"
        prompt: |
          Generate final validation report.
          
          JSON validation: {{json_validation}}
          Section count: {{section_count}}
          File existence: {{file_existence_check}}
          Circular check: {{circular_check}}
          Missing files report: {{missing_files_report}}
          
          Outline path: {{outline_path}}
          Source tree path: {{source_tree_path}}
          
          Provide summary:
          
          ✅ **Success Criteria**:
          - [ ] Source tree YAML exists
          - [ ] No circular references
          - [ ] All sources have commit hashes
          - [ ] Outline JSON is valid
          - [ ] **ZERO source files missing** (all pre-verified in Stage 3)
          - [ ] Section count matches document
          - [ ] Each section has sources with reasoning
          - [ ] Commits are current
          
          **Artifacts Created**:
          1. Source tree: {{source_tree_path}}
          2. Outline JSON: {{outline_path}}
          
          **Statistics**:
          - Total sources: [count]
          - Excluded (circular): [count]
          - Excluded (missing): [count from missing_files_report]
          - Total sections: [count]
          - External repos: [count]
          
          **File Verification Summary**:
          - Files verified in Stage 3: [count]
          - Files excluded (missing): [count]
          - Files in final validation: [should be same as verified]
          - **Missing files found in Stage 7**: [SHOULD BE ZERO - report as bug if >0]
          
          **Next Steps**:
          To regenerate the document using this outline:
          ```bash
          amplifier run "use doc-gen tool to generate document from {{outline_path}}"
          ```
          
          **Validation Guarantee**:
          All source files in the outline and source tree were READ and VERIFIED
          to exist during Stage 3. No unverified file references were included.
        output: "validation_report"
        timeout: 300
        on_error: "continue"

# ==============================================================================
# Usage Instructions
# ==============================================================================
# 
# Execute this recipe with:
#   amplifier run "execute outline-generation-from-existing-doc.yaml with target_doc=docs/DESIGN_PHILOSOPHY.md"
#
# With external repos:
#   amplifier run "execute outline-generation-from-existing-doc.yaml with target_doc=docs/DESIGN_PHILOSOPHY.md external_repos=['amplifier-foundation']"
#
# This recipe will:
# 1. Analyze the target document
# 2. Scan repositories for source files
# 3. Identify sources through evidence-based analysis
# 4. Detect and exclude circular references (PAUSES for approval)
# 5. Create source tree YAML
# 6. Generate outline JSON
# 7. Validate all outputs
#
# APPROVAL GATE:
# After circular reference detection, the recipe will pause and present
# the exclusion list for review. You can:
# - Approve: Continue with the validated source list
# - Deny: Stop execution to revise the analysis
#
# Expected duration: 15-30 minutes depending on repository size
