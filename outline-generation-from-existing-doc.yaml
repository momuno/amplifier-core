  # ==============================================================================
  # STAGE 7: VALIDATION
  # Purpose: Validate all outputs and verify correctness
  # ==============================================================================
  - name: "validation"
    description: "Validate generated artifacts and verify correctness"
    
    steps:
      - id: "validate-json-structure"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Validate the outline JSON structure.
          
          Outline path: {{outline_path}}
          
          Use bash to validate JSON:
          ```bash
          python3 -m json.tool {{outline_path}} > /dev/null && echo "✓ Valid JSON" || echo "✗ Invalid JSON"
          ```
          
          Check:
          - Valid JSON syntax
          - All required fields present
          - No empty prompts
          - All sources have file, reasoning, commit
        output: "json_validation"
        timeout: 180
        on_error: "fail"
      
      - id: "count-sections"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          **VALIDATION CHECK 2: Section Count + Completeness Verification**
          
          Outline: {{outline_path}}
          Original heading structure: {{heading_structure}}
          Target document: {{normalized_context.target_doc}}
          Document name: {{normalized_context.document_name}}
          
          **Step 1: Count sections in outline**:
          Use Python to count total sections (including nested):
          ```python
          import json
          with open('{{outline_path}}') as f:
              outline = json.load(f)
          
          def count_sections(sections):
              return len(sections) + sum(count_sections(s.get('sections', [])) for s in sections)
          
          outline_count = count_sections(outline['document']['sections'])
          print(f"Outline sections: {outline_count}")
          ```
          
          **Step 2: Count headings in original document**:
          ```bash
          # Count ALL headings (including H1)
          original_count=$(grep -cE "^#{1,6} " {{normalized_context.target_doc}})
          echo "Original headings: $original_count"
          ```
          
          **Step 3: Compare counts**:
          - If outline_count == original_count → ✅ SUCCESS
          - If outline_count != original_count → ❌ CRITICAL ERROR: Missing sections
          
          **Step 4: If mismatch, identify missing sections**:
          ```python
          import json
          import subprocess
          
          # Get all headings from original document
          result = subprocess.run(
              ["grep", "-E", "^#{1,6} ", "{{normalized_context.target_doc}}"],
              capture_output=True, text=True
          )
          original_headings = []
          for line in result.stdout.strip().split('\n'):
              # Extract heading text (remove # and spaces)
              heading = line.lstrip('#').strip()
              original_headings.append(heading)
          
          # Get all headings from outline
          with open('{{outline_path}}') as f:
              outline = json.load(f)
          
          def extract_headings(sections):
              headings = []
              for section in sections:
                  headings.append(section['heading'])
                  if 'sections' in section:
                      headings.extend(extract_headings(section['sections']))
              return headings
          
          outline_headings = extract_headings(outline['document']['sections'])
          
          # Find missing headings
          missing = [h for h in original_headings if h not in outline_headings]
          extra = [h for h in outline_headings if h not in original_headings]
          
          if missing:
              print(f"❌ MISSING SECTIONS ({len(missing)}):")
              for h in missing:
                  print(f"  - {h}")
          
          if extra:
              print(f"⚠️  EXTRA SECTIONS ({len(extra)}):")
              for h in extra:
                  print(f"  - {h}")
          ```
          
          **Output Structure**:
          ```yaml
          section_count_validation:
            original_document_headings: [count from grep]
            outline_sections: [count from outline]
            match: true/false
            missing_sections: [list of heading texts]
            extra_sections: [list of heading texts]
            status: "pass" or "fail"
            error_message: "X sections missing from outline" or null
          ```
          
          **SUCCESS CRITERIA**:
          - ✅ Counts match exactly
          - ✅ No missing sections
          - ✅ No extra sections
          
          **FAILURE MODE**:
          - ❌ Count mismatch → Stage 6 heading extraction bug
          - Report exact sections that are missing
          - Show which sections were added that shouldn't be there
        output: "section_count"
        timeout: 120
        on_error: "continue"
      
      - id: "verify-source-files-exist"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          **VALIDATION CHECK 1: Source File Existence + Commit Validation**
          
          Outline: {{outline_path}}
          Source tree: {{source_tree_path}}
          Current repo commit: {{current_repo_commit}}
          External repos: {{external_repos_detected}}
          
          **EXPECTED RESULT**: All files should exist because they were verified in Stage 3.
          
          For EACH source file referenced in the outline and source tree:
          
          **1. File Path Verification**:
          - Extract file path from GitHub URL or source tree
          - Extract repository name from URL or source entry
          - Attempt to read the file using read_file
          - If read fails → CRITICAL ERROR: File missing despite Stage 3 verification
          
          **2. Commit Hash Existence Check**:
          For each commit hash in the outline:
          ```bash
          # Verify commit exists in git repository
          git cat-file -e <commit_hash> 2>/dev/null
          # Exit code 0 = commit exists
          # Exit code non-zero = commit doesn't exist (FABRICATED)
          ```
          
          - If commit doesn't exist → CRITICAL ERROR: Fabricated commit hash
          - Report which commits are invalid
          - Show which repository each commit was supposed to be from
          
          **3. Repository Mapping Check**:
          For each source file:
          - Verify repository name matches actual file location
          - Example: If source says "amplifier-foundation:docs/FILE.md"
            → Verify FILE.md is actually in amplifier-foundation repo
          - If mapping is wrong → CRITICAL ERROR: Wrong repository
          
          **Output Structure**:
          ```yaml
          file_validation:
            total_files: [count]
            verified_exist: [count]
            missing_files: [list with paths]
            
          commit_validation:
            total_commits: [count]
            valid_commits: [count]
            invalid_commits:
              - commit: "hash"
                repository: "repo-name"
                error: "commit does not exist in repository"
                
          repository_validation:
            total_sources: [count]
            correct_mappings: [count]
            wrong_mappings:
              - file: "path"
                claimed_repo: "repo-name"
                actual_repo: "actual-repo-name"
          ```
          
          **SUCCESS CRITERIA**: 
          - ✅ All files exist (0 missing)
          - ✅ All commits are valid and exist in git (0 fabricated)
          - ✅ All repository mappings are correct (0 wrong)
          
          **FAILURE MODES**:
          - ❌ Any missing files → Stage 3 verification bug
          - ❌ Any invalid commits → Pass 4 fabricated commit hashes
          - ❌ Any wrong repo mappings → Pass 1/2/3 repository tracking bug
          
          If ANY of these checks fail, report as CRITICAL RECIPE BUG.
          
          Note: Files from external repos should be checked in their cache locations.
        output: "file_existence_check"
        timeout: 300
        on_error: "fail"
      
      - id: "verify-heading-levels"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          **VALIDATION CHECK 3: Heading Level Accuracy**
          
          Outline: {{outline_path}}
          Target document: {{normalized_context.target_doc}}
          Document name: {{normalized_context.document_name}}
          
          **Purpose**: Verify that outline preserves EXACT heading levels from original document.
          
          **Step 1: Extract heading levels from original document**:
          ```bash
          # For each heading, count # characters to determine level
          grep -E "^#{1,6} " {{normalized_context.target_doc}} | while IFS= read -r line; do
              # Count leading # characters
              level=$(echo "$line" | grep -o "^#*" | wc -c)
              # Extract heading text
              heading=$(echo "$line" | sed 's/^#* //')
              echo "$heading|$level"
          done
          ```
          
          **Step 2: Extract heading levels from outline JSON**:
          ```python
          import json
          
          with open('{{outline_path}}') as f:
              outline = json.load(f)
          
          def extract_levels(sections, results=None):
              if results is None:
                  results = []
              for section in sections:
                  results.append({
                      'heading': section['heading'],
                      'level': section['level']
                  })
                  if 'sections' in section:
                      extract_levels(section['sections'], results)
              return results
          
          outline_levels = extract_levels(outline['document']['sections'])
          for item in outline_levels:
              print(f"{item['heading']}|{item['level']}")
          ```
          
          **Step 3: Compare levels for each heading**:
          - Match headings by text
          - Compare level values
          - Report any mismatches
          
          **Common Issues to Check**:
          - ❌ H1 heading dropped (document has H1, outline doesn't)
          - ❌ H2 promoted to H1 (document has H2, outline shows level 1)
          - ❌ Any level off by 1 (indicates systematic error)
          
          **Output Structure**:
          ```yaml
          heading_level_validation:
            total_headings: [count]
            correct_levels: [count]
            incorrect_levels:
              - heading: "Section Name"
                expected_level: 2
                actual_level: 1
                error: "H2 incorrectly promoted to H1"
            status: "pass" or "fail"
            h1_present_in_document: true/false
            h1_present_in_outline: true/false
          ```
          
          **SUCCESS CRITERIA**:
          - ✅ All heading levels match exactly
          - ✅ H1 preserved if present in document
          - ✅ No level promotions or demotions
          
          **FAILURE MODES**:
          - ❌ H1 dropped → Stage 6 heading extraction bug (line 1074)
          - ❌ H2 promoted to H1 → Stage 6 level detection bug
          - ❌ Systematic off-by-one → Counting logic error
          
          If any level mismatches found, report as CRITICAL RECIPE BUG.
        output: "heading_level_check"
        timeout: 180
        on_error: "fail"
      
      - id: "verify-no-circular-references"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          **VALIDATION CHECK 4: Circular Reference Verification**
          
          Source tree: {{source_tree_yaml}}
          Exclusions: {{circular_exclusion_list}}
          
          Verify:
          - No source file references the target document
          - Dependency tree is acyclic (DAG)
          - All exclusions were properly applied
          
          If any circular references found, report as error.
        output: "circular_check"
        timeout: 180
        on_error: "fail"
      
