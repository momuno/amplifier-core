name: "outline-generation-from-existing-doc"
description: "Generate documentation outline by analyzing existing document and discovering source files"
version: "1.0.0"
tags: ["documentation", "outline-generation", "source-analysis", "dag-validation"]

# Recipe mode: staged (includes approval gates)
# This enables human-in-loop review at critical decision points

context:
  # Required: Path to document to generate outline for (accepts either document_path or target_doc)
  target_doc: ""  # e.g., "docs/DESIGN_PHILOSOPHY.md"
  document_path: ""  # Alias for target_doc
  
  # Optional: Array of external repos to check (auto-detect if not provided)
  external_repos: []  # e.g., ["amplifier-foundation"]
  
  # Optional: Working directory for artifacts
  working_dir: ".doc-gen"

# Recursion protection
recursion:
  max_depth: 2
  max_total_steps: 100

# ==============================================================================
# STAGE 0: CONTEXT VALIDATION
# Purpose: Validate inputs and normalize context variables
# ==============================================================================
stages:
  - name: "context-validation"
    description: "Validate and normalize context inputs before proceeding"
    
    steps:
      - id: "normalize-document-path"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          **CRITICAL VALIDATION STEP**: Normalize and validate document path.
          
          Context received:
          - target_doc: "{{target_doc}}"
          - document_path: "{{document_path}}"
          
          **IMPORTANT**: At least one of these must be provided.
          
          **Task**:
          1. Determine which variable was provided (document_path or target_doc)
          2. Extract the actual document path (prefer document_path if both provided)
          3. Validate the path is not empty
          4. Extract the document name from the path (e.g., "MODULE_SOURCE_PROTOCOL" from "docs/MODULE_SOURCE_PROTOCOL.md")
          5. Create normalized output with BOTH target_doc and document_name
          
          **Output format**:
          ```json
          {
            "target_doc": "actual/path/to/document.md",
            "document_name": "DOCUMENT_NAME",
            "input_source": "document_path" or "target_doc"
          }
          ```
          
          **Error conditions**:
          - If BOTH are empty: FAIL with error "No document path provided. Use document_path or target_doc."
          - If path doesn't end in .md: FAIL with error "Document path must be a .md file"
          
          This normalized path will be used throughout the recipe.
        output: "normalized_context"
        parse_json: true
        timeout: 60
        on_error: "fail"
      
      - id: "verify-working-on-correct-document"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          **DOCUMENT NAME VALIDATION**: Verify we're working on the correct document.
          
          Normalized context: {{normalized_context}}
          
          **Task**:
          1. Read the document at the normalized path
          2. Extract the document name from the path
          3. Verify the document exists
          4. Display clearly: "Working on document: [DOCUMENT_NAME] at path: [PATH]"
          
          **This step ensures**:
          - We know exactly what document we're generating an outline for
          - The document exists and is readable
          - There's no silent fallback to a different document
          
          If the document doesn't exist, FAIL with a clear error message.
        output: "document_verification"
        timeout: 120
        on_error: "fail"

  # ==============================================================================
  # STAGE 1: DOCUMENT ANALYSIS
  # Purpose: Extract essence, purpose, and scope of target document
  # ==============================================================================
  - name: "document-analysis"
    description: "Analyze target document to understand its purpose and scope"
    
    steps:
      - id: "validate-target-exists"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Verify that the target document exists at: {{normalized_context.target_doc}}
          
          **IMPORTANT**: We are working on document: {{normalized_context.document_name}}
          
          Use read_file to check if the file exists and is readable.
          If it doesn't exist, report an error with the exact path that was checked.
          If it exists, report success with the file size and line count.
          
          Verify the document name in the path matches: {{normalized_context.document_name}}
        output: "target_validation"
        timeout: 120
        on_error: "fail"
      
      - id: "read-target-document"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Read the complete target document: {{normalized_context.target_doc}}
          
          **Working on**: {{normalized_context.document_name}}
          
          Capture the full content for analysis in subsequent steps.
        output: "target_content"
        timeout: 300
        on_error: "fail"
      
      - id: "extract-document-essence"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Analyze the target document and extract:
          
          1. **Purpose**: What is this document about? (1-2 sentences)
          2. **Scope**: What topics/concepts does it cover?
          3. **Essence**: What is the main point it communicates?
          4. **Document Type**: Is this technical reference, explanatory synthesis, or overview?
          5. **Key Sections**: List the main heading structure
          
          Document content:
          {{target_content}}
          
          Provide a concise summary that captures the document's intent.
        output: "document_analysis"
        parse_json: true
        timeout: 600
        on_error: "fail"

  # ==============================================================================
  # STAGE 2: REPOSITORY SCAN
  # Purpose: Build comprehensive understanding of all available source material
  # ==============================================================================
  - name: "repository-scan"
    description: "Scan current repository and external repos for potential source files"
    
    steps:
      - id: "find-repo-files"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Discover all files in the current repository that could be potential sources.
          
          Use glob or bash to find:
          - All markdown files (*.md)
          - Documentation files (docs/*, context/*)
          - Specification files (specs/*)
          - README files
          - Code files that might contain examples (src/*, lib/*, *.py, *.js, etc.)
          - Test files that illustrate behavior (tests/*, *.py, etc.)
          - Configuration files that might contain documentation
          
          Exclude:
          - node_modules/
          - .venv/
          - .git/
          - __pycache__/
          - build/
          - dist/
          - .doc-gen/
          
          Output a structured list of file paths grouped by type.
        output: "repo_file_list"
        parse_json: true
        timeout: 300
        on_error: "fail"
      
      - id: "detect-external-repos"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Detect external repositories that might contain source material.
          
          Check: 
          - User-provided repos: {{external_repos}}
            - NOTE: You should always pull the latest version of this repo. If url not specified from user, look for it on www.github.com/Microsoft/<repo_name>
          
          
          For each detected external repo:
          - Get the full path
          - Get the commit hash (git rev-parse HEAD)
          - List key documentation files
          
          If no external repos provided and none detected, note that and continue with current repo only.
        output: "external_repos_detected"
        parse_json: true
        timeout: 300
        on_error: "continue"
      
      - id: "get-current-repo-commit"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Get the current commit hash for this repository.
          
          Run: git rev-parse HEAD
          
          Output the full 40-character commit hash.
        output: "current_repo_commit"
        timeout: 60
        on_error: "fail"

  # ==============================================================================
  # STAGE 3: SOURCE DISCOVERY (Multi-Pass Approach)
  # Purpose: Identify source files through 4 focused, sequential passes
  # Strategy: Broad → Refined → Validated → Finalized
  # ==============================================================================
  - name: "source-discovery"
    description: "Multi-pass source discovery: broad identification, refinement, circular check, finalization"
    
    steps:
      # ============================================================================
      # UPFRONT FILE VERIFICATION (Gates all subsequent analysis)
      # ============================================================================
      
      - id: "verify-current-repo-files-exist"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          **CRITICAL GATING STEP**: ACTUALLY VERIFY each file exists by CALLING read_file.
          
          Files from repository scan: {{repo_file_list}}
          
          **MANDATORY VERIFICATION PROCESS**:
          
          You MUST call read_file on EVERY SINGLE file in the list. DO NOT assume files exist.
          DO NOT skip verification. DO NOT trust the file list without checking.
          
          For EACH file path in {{repo_file_list}}:
          
          1. **CALL read_file(file_path)** - Actually invoke the tool
          2. **Check the result**:
             - If read_file SUCCEEDS (returns content) → Add to VERIFIED_FILES
             - If read_file FAILS (error/exception) → Add to MISSING_FILES
          3. **Record evidence**: Capture line_count for verified, error message for missing
          
          **DO NOT**:
          - ❌ Assume files exist without calling read_file
          - ❌ Skip files or batch-check them
          - ❌ Trust paths without verification
          - ❌ Include ANY file in VERIFIED_FILES that you didn't successfully read
          
          **YOU MUST**:
          - ✅ Call read_file individually on each file path
          - ✅ Verify EVERY file in the input list
          - ✅ Track which files actually exist vs which don't
          - ✅ Only mark as "verified" if read_file succeeded
          
          **Output TWO separate lists**:
          
          **VERIFIED_FILES** (you successfully read these with read_file):
          ```json
          [
            {
              "file_path": "path/to/file.md",
              "line_count": <actual line count from read_file>,
              "status": "verified",
              "verified_at": "<timestamp>"
            }
          ]
          ```
          
          **MISSING_FILES** (read_file failed on these):
          ```json
          [
            {
              "file_path": "path/to/missing.md",
              "error": "<exact error message from read_file>",
              "status": "missing",
              "attempted_at": "<timestamp>"
            }
          ]
          ```
          
          **CRITICAL RULE**: 
          If a file is NOT in VERIFIED_FILES, it MUST be in MISSING_FILES.
          Every input file must be accounted for in one list or the other.
          
          **VALIDATION**:
          - len(VERIFIED_FILES) + len(MISSING_FILES) = len({{repo_file_list}})
          - Each file appears in exactly ONE list
          - VERIFIED_FILES only contains files you actually read successfully
          
          **WHY THIS MATTERS**:
          Stage 2 generated file paths that may have errors (wrong directories, typos, etc.).
          This step is the ONLY gate that prevents invalid paths from reaching the outline.
          If you don't actually call read_file, invalid paths will break document generation.
          
          **EXPECTATION**: You will call read_file dozens or hundreds of times in this step.
          That's correct. Don't try to optimize it away. Verify EVERY file.
        output: "current_repo_verification"
        parse_json: true
        timeout: 900
        on_error: "fail"
      
      - id: "verify-external-repo-files-exist"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          **GATING STEP**: Verify external repository files exist.
          
          External repos detected: {{external_repos_detected}}
          
          If no external repos were detected, output empty lists and continue.
          
          For EACH external repo file:
          1. Use read_file to verify it exists
          2. If read succeeds → File EXISTS
          3. If read fails → File is MISSING
          
          **CRITICAL: Repository Name Recording**:
          - Record the EXACT repository name from {{external_repos_detected}}
          - Example: If detecting files from "amplifier-foundation", record "repository: amplifier-foundation"
          - DO NOT use generic names like "external" or "external-repo"
          - The repository name will be used in ALL subsequent passes
          
          Create TWO lists:
          
          **VERIFIED_EXTERNAL_FILES**:
          - file_path: "full/path/to/file.md"
          - repository: "exact-repo-name"  # e.g., "amplifier-foundation"
          - status: "verified"
          - line_count: [from read_file output]
          
          **MISSING_EXTERNAL_FILES**:
          - file_path: "full/path/to/file.md"
          - repository: "exact-repo-name"
          - error: "reason"
          - status: "missing"
          
          Only verified external files can be used in subsequent passes.
        output: "external_repo_verification"
        parse_json: true
        timeout: 600
        on_error: "continue"
      
      - id: "report-missing-files"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Report on ALL missing files for user awareness.
          
          Current repo verification: {{current_repo_verification}}
          External repo verification: {{external_repo_verification}}
          
          Combine MISSING_FILES from both verifications and provide summary:
          - Total missing files count
          - Missing files by repository
          - Possible reasons (deleted, moved, wrong path, etc.)
          
          This is informational only - missing files are already excluded.
        output: "missing_files_report"
        timeout: 180
        on_error: "continue"
      
      # ============================================================================
      # PASS 1: Broad Potential Source Identification
      # Input: Target document + ALL verified files
      # Process: For EACH file, read and ask "Could this be a source?"
      # Output: Broad POTENTIAL sources list (be INCLUSIVE)
      # ============================================================================
      
      - id: "pass1-identify-potential-sources"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          **PASS 1: Broad Potential Source Identification**
          
          Goal: Be INCLUSIVE - capture all files that COULD be sources for the target document.
          
          # ==============================================================================
          # INPUT DATA
          # ==============================================================================
          
          Target document essence:
          {{document_analysis}}
          
          Target document content:
          {{target_content}}
          
          Verified current repo files:
          {{current_repo_verification}}
          
          Verified external repo files:
          {{external_repo_verification}}
          
          # ==============================================================================
          # PROCESS
          # ==============================================================================
          
          For EACH verified file (current repo + external repo):
          
          1. **Read the file** using read_file
          
          2. **Record the repository** (CRITICAL for correct mapping):
             - If from {{current_repo_verification}} → repository: "current"
             - If from {{external_repo_verification}} → use the EXACT repository name
             - Example: "amplifier-foundation" NOT "external" or "external-repo"
             - This repository name MUST be preserved through ALL passes
          
          3. **Ask: "Could this file be a source for the target document?"**
          
          4. **Analysis includes**:
             - **Inverse synthesis**: Would an author need this to write the target?
             - **Keyword/term detection**: Similar concepts, terminology, technical terms?
             - **Conceptual alignment**: Related ideas, foundations, specifications?
             - **Domain relevance**: Does it cover the same problem space?
          
          5. **Reasoning**: Record WHY this file could be a source
             - What concepts/terms/ideas overlap?
             - How might it have informed the target?
             - What knowledge does it provide?
          
          # ==============================================================================
          # INCLUSION CRITERIA (Be Generous)
          # ==============================================================================
          
          Include a file as POTENTIAL if ANY of these are true:
          - ✅ Contains related technical concepts or terminology
          - ✅ Defines foundations that target builds on
          - ✅ Covers same problem domain or architecture
          - ✅ Contains examples, specs, or patterns target might reference
          - ✅ Provides background knowledge target assumes
          - ✅ Even weak conceptual overlap (we'll refine in Pass 2)
          
          Exclude only if:
          - ❌ Completely unrelated domain (e.g., testing code when target is about philosophy)
          - ❌ No shared concepts or terminology whatsoever
          - ❌ Different technology stack with no conceptual overlap
          
          # ==============================================================================
          # OUTPUT FORMAT
          # ==============================================================================
          
          For EACH potential source:
          ```yaml
          potential_sources:
            - file: "path/to/file.md"
              repository: "current" or "exact-external-repo-name"  # e.g., "amplifier-foundation"
              pass1_reasoning: |
                Why this could be a source:
                - Conceptual overlap: [describe]
                - Keywords/terms: [list matching terms]
                - Domain relevance: [explain]
                - Inverse synthesis: [what target might have drawn from this]
              verification_status: "verified-exists"
          ```
          
          **CRITICAL: Repository Name Accuracy**:
          - For current repo files: Use "current"
          - For external repo files: Use EXACT name from {{external_repo_verification}}
          - Example: "amplifier-foundation" NOT "external" or "external-repo-name"
          - This repository name will flow through Pass 2 → Pass 3 → Pass 4 → Final outline
          
          # ==============================================================================
          # STRATEGY
          # ==============================================================================
          
          - **Err on side of INCLUSION**: It's better to capture too many in Pass 1
          - **Multi-read**: Read each file to understand its content
          - **Document reasoning**: Explain WHY each file is potentially relevant
          - **NO filtering yet**: Pass 2 will require strong evidence; Pass 1 is exploration
          - **Accurate repository tracking**: Record EXACT repository name from verification steps
          
          **RULE**: Only include files from VERIFIED_FILES lists (already gated above).
        output: "pass1_potential_sources"
        parse_json: true
        timeout: 1800
        on_error: "fail"
      
      # ============================================================================
      # PASS 2: Confirmed Source Refinement
      # Input: Full target + ALL potential sources from Pass 1
      # Process: Re-read everything, require STRONG evidence
      # Output: Refined CONFIRMED sources list (be SELECTIVE)
      # ============================================================================
      
      - id: "pass2-refine-to-confirmed-sources"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          **PASS 2: Confirmed Source Refinement**
          
          Goal: Be SELECTIVE - narrow to sources that were MOST LIKELY referenced.
          
          # ==============================================================================
          # INPUT DATA (Fresh Re-Read)
          # ==============================================================================
          
          Target document (RE-READ COMPLETELY):
          {{target_content}}
          
          Target document analysis:
          {{document_analysis}}
          
          Potential sources from Pass 1:
          {{pass1_potential_sources}}
          
          # ==============================================================================
          # PROCESS
          # ==============================================================================
          
          With BOTH target and potential sources fresh in context:
          
          1. **Re-read each potential source file** (get full content back in context)
          
          2. **Ask: "Was this source MOST LIKELY referenced to create the target?"**
          
          3. **Evidence Required** (at least ONE must be TRUE):
             - **Direct text matches or paraphrasing**: Quote from target matches/paraphrases source
             - **Conceptual content in target**: Target explains concepts defined in source
             - **Specifications cited**: Target uses specs/standards from source
             - **Foundation knowledge**: Target assumes knowledge provided by source
             - **Examples referenced**: Target cites or builds on source examples
          
          4. **Record specific evidence**:
             - Quote exact text from TARGET: "[quote]"
             - Quote matching text from SOURCE: "[quote]"
             - OR Concept match: "Target explains X (quote), source defines X (quote)"
          
          # ==============================================================================
          # REFINEMENT CRITERIA (Be Strict)
          # ==============================================================================
          
          Promote to CONFIRMED if evidence shows:
          - ✅ **Direct content match**: Text in target clearly derives from source
          - ✅ **Concept explanation**: Target explains concepts this source defines
          - ✅ **Specification usage**: Target uses specs/APIs/standards from source
          - ✅ **Foundation dependency**: Target's arguments require this source's concepts
          - ✅ **Example reference**: Target's examples come from or build on this source
          
          Keep as potential-only (don't confirm) if:
          - ⚠️ Only weak conceptual overlap
          - ⚠️ Shared terminology but no content derivation
          - ⚠️ Related domain but no clear influence
          
          Exclude entirely if:
          - ❌ No evidence of actual usage in target
          - ❌ Only abstract "could be related" reasoning
          - ❌ Conceptual mismatch revealed by deeper reading
          
          # ==============================================================================
          # OUTPUT FORMAT
          # ==============================================================================
          
          For EACH confirmed source:
          ```yaml
          confirmed_sources:
            - file: "path/to/file.md"
              repository: "current" or "exact-external-repo-name"  # PRESERVE from Pass 1
              confidence: "high" or "medium"
              pass2_evidence: |
                STRONG evidence this was referenced:
                - Target quote: "[exact text from target]"
                - Source quote: "[matching text from source]"
                - Concept match: "[specific concept in both with quotes]"
                - Specification: "[spec used in target, defined in source]"
                - Foundation: "[knowledge target assumes, source provides]"
              contributes_to_sections: ["Section Name 1", "Section Name 2"]
              verification_status: "verified-exists"
          ```
          
          **CRITICAL: Repository Name Preservation**:
          - Copy the EXACT "repository" value from Pass 1 for each file
          - DO NOT modify or infer repository names
          - If Pass 1 said "amplifier-foundation", Pass 2 MUST say "amplifier-foundation"
          - This ensures correct mapping from source → outline
          
          # ==============================================================================
          # CONFIDENCE LEVELS
          # ==============================================================================
          
          - **High**: Multiple direct text matches OR strong concept alignment with quotes
          - **Medium**: Clear conceptual content match with specific supporting evidence
          
          (Low confidence should be EXCLUDED - don't include in confirmed list)
          
          # ==============================================================================
          # STRATEGY
          # ==============================================================================
          
          - **Multi-read**: Re-read BOTH target and sources to have fresh context
          - **Evidence-based**: Every source needs specific quotes or concrete matches
          - **Selective filtering**: Many potential sources won't have strong evidence
          - **Quote precisely**: Provide actual text from both target and source
          
          **Expected**: Confirmed list should be SMALLER than potential list.
          Only sources with strong evidence should make it through Pass 2.
        output: "pass2_confirmed_sources"
        parse_json: true
        timeout: 1800
        on_error: "fail"
      
      # ============================================================================
      # PASS 3: Cyclical Dependency Check
      # Input: Confirmed sources + target document path
      # Process: Check if any source references/links TO the target
      # Output: Validated sources with circular references REMOVED
      # ============================================================================
      
      - id: "pass3-check-circular-references"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          **PASS 3: Cyclical Dependency Check**
          
          Goal: Be PROTECTIVE - eliminate circular dependencies to maintain DAG structure.
          
          # ==============================================================================
          # INPUT DATA
          # ==============================================================================
          
          Target document path:
          {{normalized_context.target_doc}}
          Document name: {{normalized_context.document_name}}
          
          Confirmed sources from Pass 2:
          {{pass2_confirmed_sources}}
          
          # ==============================================================================
          # PROCESS
          # ==============================================================================
          
          For EACH confirmed source:
          
          1. **Re-read the source file** to check for references to target
          
          2. **Ask: "Does this source reference or link TO the target document?"**
          
          3. **Check for**:
             - Markdown links: [text]({{normalized_context.target_doc}})
             - Relative links: [text](path/to/{{normalized_context.target_doc}})
             - Filename mentions in prose
             - @mentions or imports of target
             - Any reference indicating source depends on target
          
          4. **Apply circular reference rule**:
             - If source links TO target → source is HIGHER in abstraction tree
             - Higher-level docs abstract/summarize LOWER-level docs
             - Using higher-level doc as source for lower-level = CIRCULAR
             - **EXCLUDE** to prevent cycle
          
          # ==============================================================================
          # CIRCULAR REFERENCE RULES
          # ==============================================================================
          
          **Direction matters**:
          - ✅ Target references source → OK (info flows UP)
          - ❌ Source references target → CIRCULAR (would create cycle)
          
          **Example**:
          - README.md links to DESIGN_PHILOSOPHY.md
          - README is HIGHER (abstracts/summarizes)
          - README CANNOT be source for DESIGN_PHILOSOPHY
          - That would be circular: DESIGN_PHILOSOPHY would depend on its own summary
          
          **Abstraction hierarchy**:
          ```
          Top-level (README, overview)
              ↓ references/abstracts
          Mid-level (explanatory docs, synthesis)
              ↓ references/derives
          Leaf-level (specs, code, foundational docs)
          ```
          
          # ==============================================================================
          # OUTPUT FORMAT
          # ==============================================================================
          
          **Validated Sources** (no circular references):
          ```yaml
          validated_sources:
            - file: "path/to/file.md"
              repository: "repo-name"  # PRESERVE from Pass 2 EXACTLY
              confidence: "high|medium"
              evidence: "[from Pass 2]"
              contributes_to_sections: ["section1", "section2"]
              circular_check: "no-reference-to-target"
              verification_status: "verified-exists"
          ```
          
          **CRITICAL: Repository Name Preservation**:
          - Copy the EXACT "repository" value from Pass 2 for each file
          - DO NOT modify repository names during circular reference check
          - Pass through: Pass 1 → Pass 2 → Pass 3 → Pass 4
          
          **Excluded Sources** (circular references found):
          ```yaml
          circular_exclusions:
            - file: "path/to/excluded.md"
              repository: "repo-name"  # PRESERVE from Pass 2
              reason: "References target document - higher in abstraction tree"
              evidence: |
                Found reference to target:
                - Link: [text]({{normalized_context.target_doc}})
                - Line: [line number]
                - Context: [surrounding text]
              hierarchy_level: "higher-than-target"
          ```
          
          # ==============================================================================
          # STRATEGY
          # ==============================================================================
          
          - **Grep for links**: Use grep to find markdown link patterns efficiently
          - **Read to verify**: Read files to understand context of references
          - **Document exclusions**: Provide clear evidence for each excluded source
          - **Preserve structure**: Keep documentation for approval/review stage
          
          **Expected**: Most sources should pass (no circular refs), but some may be excluded.
          Any file that links TO the target must be excluded.
        output: "pass3_validated_sources"
        parse_json: true
        timeout: 900
        on_error: "fail"
      
      # ============================================================================
      # PASS 4: Finalized Source List
      # Input: Validated sources + commit hashes for all repos
      # Process: Add commit info, structure cleanly
      # Output: Clean source list ready for outline generation
      # ============================================================================
      
      - id: "pass4-finalize-source-list"
        agent: "foundation:zen-architect"
        mode: "ARCHITECT"
        prompt: |
          **PASS 4: Finalized Source List**
          
          Goal: Create CLEAN, structured source list ready for outline generation.
          
          # ==============================================================================
          # INPUT DATA
          # ==============================================================================
          
          Validated sources from Pass 3:
          {{pass3_validated_sources}}
          
          Current repository commit:
          {{current_repo_commit}}
          
          External repositories:
          {{external_repos_detected}}
          
          # ==============================================================================
          # CRITICAL: COMMIT HASH RULES
          # ==============================================================================
          
          **STRICT REQUIREMENT**: Use ONLY actual commit hashes from the input data above.
          
          ❌ **PROHIBITED**: DO NOT generate, fabricate, or invent commit hashes
          ❌ **PROHIBITED**: DO NOT create fake 40-character hex strings
          ❌ **PROHIBITED**: DO NOT guess at commit values
          
          ✅ **REQUIRED**: Extract commit hashes ONLY from:
          1. Current repo files → Use EXACT value from {{current_repo_commit}}
          2. External repo files → Extract EXACT commit from {{external_repos_detected}} for that repo
          
          **Validation**: Every commit hash MUST be traceable to the input data.
          If you cannot find a commit hash for a repository, REQUEST IT - do not fabricate.
          
          # ==============================================================================
          # CRITICAL: REPOSITORY MAPPING RULES
          # ==============================================================================
          
          **STRICT REQUIREMENT**: Use ONLY the actual repository names from Pass 1/2/3.
          
          ❌ **PROHIBITED**: DO NOT guess repository names
          ❌ **PROHIBITED**: DO NOT infer repository from file path patterns
          ❌ **PROHIBITED**: DO NOT assume repository based on content
          
          ✅ **REQUIRED**: Use EXACT repository name from Pass 3 validated sources
          - If Pass 3 says "repository: amplifier-foundation" → Use "amplifier-foundation"
          - If Pass 3 says "repository: current" → Use "current"
          - DO NOT change or modify repository names
          
          **Validation**: Every repository name MUST match Pass 3 exactly.
          
          # ==============================================================================
          # PROCESS
          # ==============================================================================
          
          For EACH validated source from Pass 3:
          
          1. **Preserve repository name** (DO NOT modify):
             - Use the EXACT repository value from Pass 3
             - Example: If Pass 3 has "repository: amplifier-foundation", use "amplifier-foundation"
          
          2. **Add commit hash** (use ACTUAL commits ONLY):
             - If repository is "current" → Use {{current_repo_commit}} EXACTLY as provided
             - If repository is external (e.g., "amplifier-foundation"):
               a. Find this repository in {{external_repos_detected}}
               b. Extract its commit hash
               c. Use that EXACT commit hash
             - NEVER generate or fabricate commit hashes
          
          3. **Structure cleanly**:
             - All required fields present
             - Consistent formatting
             - Full 40-character commit hashes (from input data)
          
          4. **Verify completeness**:
             - File path present (from Pass 3)
             - Repository name present (from Pass 3, UNMODIFIED)
             - Commit hash added (from input data, NEVER fabricated)
             - Evidence preserved from Pass 2
             - Confidence level from Pass 2
             - Section mappings from Pass 2
          
          # ==============================================================================
          # OUTPUT FORMAT
          # ==============================================================================
          
          **Final Source List** (ready for outline generation):
          ```yaml
          sources:
            - file: "path/to/file.md"
              repository: "repo-name"  # EXACT value from Pass 3
              commit: "full-40-character-commit-hash"  # EXACT value from input data
              confidence: "high|medium"
              evidence: |
                [Preserved from Pass 2]
                Strong evidence this was referenced:
                - Target quote: "[...]"
                - Source quote: "[...]"
              supports_sections: ["Section 1", "Section 2"]
              verification_status: "verified-exists"
              circular_check: "passed"
          ```
          
          **Circular Exclusions** (for review):
          ```yaml
          circular_exclusions:
            - file: "path/to/excluded.md"
              reason: "References target - higher in abstraction tree"
              evidence: "[from Pass 3]"
          ```
          
          **Statistics**:
          ```yaml
          statistics:
            total_files_scanned: [count from Pass 1]
            potential_sources_identified: [count from Pass 1]
            confirmed_sources: [count from Pass 2]
            circular_exclusions: [count from Pass 3]
            final_sources: [count after Pass 3]
            verification_status: "all-sources-verified-exist"
          ```
          
          # ==============================================================================
          # QUALITY CHECKS
          # ==============================================================================
          
          Before finalizing, verify:
          - ✅ All commit hashes are full 40-character strings FROM INPUT DATA
          - ✅ All commit hashes are traceable to {{current_repo_commit}} or {{external_repos_detected}}
          - ✅ All repository names MATCH Pass 3 exactly (no modifications)
          - ✅ All files have verification_status: "verified-exists"
          - ✅ No circular references in final list
          - ✅ Evidence preserved from Pass 2 for each source
          - ✅ Section mappings present
          - ✅ NO fabricated or generated commit hashes
          
          # ==============================================================================
          # STRATEGY
          # ==============================================================================
          
          This is the CLEAN OUTPUT step:
          - Take validated sources from Pass 3 (preserve repository names EXACTLY)
          - Add commit information (from input data ONLY - never fabricate)
          - Structure for downstream consumption
          - Preserve all evidence and analysis
          - Ready for Stage 4 (circular detection review) and Stage 5 (outline generation)
          
          **Output name**: "initial_source_list" (matches what later stages expect)
        output: "initial_source_list"
        parse_json: true
        timeout: 600
        on_error: "fail"

  # ==============================================================================
  # STAGE 4: CIRCULAR REFERENCE DETECTION (APPROVAL GATE)
  # Purpose: Ensure source tree is a DAG with no cycles
  # ==============================================================================
  - name: "circular-detection"
    description: "Detect and exclude circular references to maintain DAG structure"
    approval_required: true
    
    steps:
      - id: "find-references-to-target"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Find all documents that reference the target document.
          
          Target: {{normalized_context.target_doc}}
          Document name: {{normalized_context.document_name}}
          
          Search the repository for files that link to or reference this document:
          - Use grep to find mentions of the filename
          - Check README.md, index files, navigation docs
          - Look for markdown links like [text]({{normalized_context.target_doc}})
          
          Output a list of files that reference the target.
        output: "referencing_documents"
        timeout: 300
        on_error: "continue"
      
      - id: "analyze-abstraction-hierarchy"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Analyze the abstraction hierarchy to determine document levels.
          
          Target document: {{normalized_context.target_doc}}
          Document name: {{normalized_context.document_name}}
          Document analysis: {{document_analysis}}
          Documents referencing target: {{referencing_documents}}
          Initial source list: {{initial_source_list}}
          
          For each document that references the target:
          - Is it HIGHER level (overview, README, index)?
          - Is it LOWER level (detailed spec, implementation)?
          
          **Rule**: Higher-level docs CANNOT be sources for lower-level docs.
          
          If a document links TO the target:
          - The referring document is HIGHER in the tree
          - It abstracts/summarizes content FROM the target
          - It CANNOT be a source FOR the target (would create cycle)
          
          Build dependency hierarchy:
          ```
          Top-level (README, overview)
              ↓ reference/abstract
          Mid-level (explanatory docs, synthesis)
              ↓ reference/derive
          Leaf-level (specs, code, foundational docs)
          ```
        output: "hierarchy_analysis"
        parse_json: true
        timeout: 600
        on_error: "fail"
      
      - id: "identify-circular-references"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Identify circular references that must be excluded.
          
          Hierarchy analysis: {{hierarchy_analysis}}
          Initial sources: {{initial_source_list}}
          
          For each source in the initial list:
          - Does it reference the target document?
          - Is it higher in the abstraction tree?
          - Would using it as a source create a cycle?
          
          Create exclusion list with detailed reasoning for each exclusion:
          ```yaml
          exclusions:
            - file: "path/to/file"
              reason: "References target document - higher in abstraction tree"
              evidence: "Contains link to {{normalized_context.target_doc}}"
              hierarchy_level: "top-level"
          ```
          
          **IMPORTANT**: This exclusion list will be presented to the user for approval.
          Provide clear, evidence-based reasoning for each exclusion.
        output: "circular_exclusion_list"
        parse_json: true
        timeout: 600
        on_error: "fail"
      
      - id: "create-validated-source-list"
        agent: "foundation:zen-architect"
        mode: "ARCHITECT"
        prompt: |
          Create the validated source list with circular references removed.
          
          Initial sources: {{initial_source_list}}
          Exclusions: {{circular_exclusion_list}}
          
          Remove excluded files and create final source list.
          
          For each remaining source:
          - Verify no circular references
          - Confirm hierarchy is valid (source at same or lower level)
          - Document why it's included
          
          Output structured source list ready for source tree creation.
        output: "validated_source_list"
        parse_json: true
        timeout: 300
        on_error: "fail"
      
      - id: "present-exclusions-for-approval"
        agent: "foundation:zen-architect"
        mode: "REVIEW"
        prompt: |
          Present the circular reference analysis for user review.
          
          **Exclusion Summary**:
          {{circular_exclusion_list}}
          
          **Validated Source List**:
          {{validated_source_list}}
          
          **Hierarchy Analysis**:
          {{hierarchy_analysis}}
          
          Please review:
          1. Are the exclusions correct?
          2. Are there any sources that should be excluded but aren't?
          3. Is the abstraction hierarchy analysis accurate?
          
          Provide a clear summary that explains:
          - Why each file was excluded (circular reference, hierarchy violation)
          - The final source count
          - The dependency structure
          
          Format this for easy review and approval.
        output: "approval_summary"
        timeout: 300
        on_error: "fail"

  # ==============================================================================
  # STAGE 5: SOURCE TREE CREATION
  # Purpose: Create machine-readable record of source dependencies
  # ==============================================================================
  - name: "source-tree"
    description: "Create source tree YAML documenting the dependency DAG"
    
    steps:
      - id: "extract-document-metadata"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Extract metadata for the source tree.
          
          Target document: {{normalized_context.target_doc}}
          Document name: {{normalized_context.document_name}}
          Document analysis: {{document_analysis}}
          Hierarchy: {{hierarchy_analysis}}
          
          Extract:
          - Document path
          - Document type (mid-level-synthesis, leaf-node, top-level-overview)
          - Purpose (brief description)
          - Scope (what it covers)
          - Referenced by (higher-level docs)
          - References to (docs it links to)
        output: "document_metadata"
        parse_json: true
        timeout: 300
        on_error: "fail"
      
      - id: "build-source-tree-yaml"
        agent: "foundation:zen-architect"
        mode: "ARCHITECT"
        prompt: |
          Build the source tree YAML file.
          
          Document metadata: {{document_metadata}}
          Validated sources: {{validated_source_list}}
          Exclusions: {{circular_exclusion_list}}
          Current repo commit: {{current_repo_commit}}
          External repos: {{external_repos_detected}}
          
          Structure:
          ```yaml
          document:
            path: "{{normalized_context.target_doc}}"
            type: "mid-level-synthesis"  # or leaf-node, top-level-overview
            purpose: "Brief description"
            scope: "What it covers"
            referenced_by: [list of higher-level docs]
            references_to: [list of docs it links to]
          
          sources:
            - file: "path/to/source.md"
              repository: "repo-name"
              url: "https://github.com/org/repo/blob/COMMIT/path"
              commit: "full-commit-hash"
              type: "leaf"  # or mid-level
              contributes: ["concept", "section", "foundation"]
              evidence: "Why this file is a source"
          
          circular_analysis:
            excluded:
              - file: "path/to/excluded"
                reason: "Higher in abstraction tree - would create cycle"
                evidence: "Links to target document"
            
            validation_rules:
              - "No circular references in dependency tree"
              - "Information flows upward, references flow downward"
              - "Source files at same or lower abstraction level"
          
          dependency_tree: |
            [Create ASCII visualization of the dependency structure]
          
          generated:
            date: "[Use current timestamp: $(date -Iseconds)]"
            recipe_version: "1.0.0"
            current_commit: "{{current_repo_commit}}"
          ```
          
          Ensure all commit hashes are full 40-character hashes.
        output: "source_tree_yaml"
        timeout: 600
        on_error: "fail"
      
      - id: "write-source-tree-file"
        agent: "foundation:zen-architect"
        mode: "ARCHITECT"
        prompt: |
          Write the source tree to the file system.
          
          Document name: {{normalized_context.document_name}}
          - This was extracted in Stage 0 from the document path
          
          Target file: {{working_dir}}/source-trees/{DOC_NAME}.yaml
          
          Content: {{source_tree_yaml}}
          
          Use write_file to create the source tree YAML.
          Create the directory if it doesn't exist.
        output: "source_tree_path"
        timeout: 300
        on_error: "fail"

  # ==============================================================================
  # STAGE 6: OUTLINE GENERATION
  # Purpose: Create structured JSON outline mapping sections to sources
  # ==============================================================================
  - name: "outline-generation"
    description: "Generate the final outline JSON with section-to-source mappings"
    
    steps:
      - id: "read-outline-examples"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Read example outlines to understand the required structure.
          
          Read these files if they exist:
          - .doc-gen/examples/sample-outline.json
          - .doc-gen/examples/hooks_outline.json
          
          Extract:
          - Required fields (meta, document, sections)
          - Section schema (heading, level, prompt, sources)
          - Source format (file URL, reasoning, commit)
          - Nesting structure for subsections
          
          If examples don't exist, use this schema:
          ```json
          {
            "meta": {
              "name": "document-name",
              "model": "claude-sonnet-4",
              "temperature": 0.7,
              "max_tokens": 8000,
              "document_instruction": "Overall guidance for document generation"
            },
            "document": {
              "title": "Document Title",
              "output": "path/to/output.md",
              "sections": [...]
            }
          }
          ```
        output: "outline_schema"
        timeout: 300
        on_error: "continue"
      
      - id: "extract-heading-structure"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Extract the heading structure from the target document.
          
          Target document path: {{normalized_context.target_doc}}
          Document name: {{normalized_context.document_name}}
          
          **CRITICAL: Heading Level Extraction Rules**
          
          Use bash with grep to extract ALL headings with CORRECT levels:
          
          ```bash
          grep -E "^#{1,6} " {{normalized_context.target_doc}}
          ```
          
          For EACH heading line:
          1. **Count the # characters** to determine level:
             - `#` (1 hash) = level 1
             - `##` (2 hashes) = level 2
             - `###` (3 hashes) = level 3
             - etc.
          
          2. **Extract heading text** (everything after the hashes and space):
             - Remove leading `#` characters and space
             - Preserve the actual heading text
          
          3. **DO NOT drop any headings**:
             - Include the H1 title (if present)
             - Include ALL H2, H3, H4, etc. sections
             - Every heading in the document MUST be captured
          
          4. **DO NOT modify heading levels**:
             - If document has `#` → output level 1
             - If document has `##` → output level 2
             - DO NOT promote H2 to H1
             - DO NOT skip the H1 level
          
          **Example Extraction Logic**:
          ```bash
          # For each line matching "^#{1,6} ":
          # 1. Count leading # characters
          echo "## Core Principles" | grep -o "^#*" | wc -c
          # Result: 2 → level = 2
          
          # 2. Extract text after "# "
          echo "## Core Principles" | sed 's/^#* //'
          # Result: "Core Principles"
          ```
          
          **Validation Check**:
          After extraction, COUNT the total headings:
          ```bash
          grep -cE "^#{1,6} " {{normalized_context.target_doc}}
          ```
          
          Compare this count to your extracted structure.
          - If counts match → SUCCESS ✅
          - If counts differ → ERROR ❌ (you're missing headings)
          
          **Output Structure**:
          For each heading, output:
          ```json
          {
            "heading": "Exact heading text",
            "level": 1,  // Actual level from counting #
            "position": 1,  // Line number or sequence
            "parent_heading": "Parent Heading"  // For nesting (optional)
          }
          ```
          
          **Quality Checks**:
          - ✅ All headings extracted (count matches grep count)
          - ✅ Levels are correct (based on # count)
          - ✅ H1 heading is NOT dropped
          - ✅ H2 headings remain level 2 (not promoted to 1)
          - ✅ Heading text is accurate
          
          **Expected Result**:
          A complete list of ALL headings with CORRECT levels, ready for outline generation.
        output: "heading_structure"
        parse_json: true
        timeout: 300
        on_error: "fail"
      
      - id: "map-sections-to-sources"
        agent: "foundation:zen-architect"
        mode: "ANALYZE"
        prompt: |
          Map each section to its source files.
          
          Heading structure: {{heading_structure}}
          Confirmed sources with evidence: {{pass2_confirmed_sources}}
          Final source list: {{initial_source_list}}
          
          For each section:
          1. Identify which source files contain relevant content
          2. Determine what each source contributes to this section
          3. Write reasoning for why each source is included
          4. Assign confidence/evidence level
          
          Use the evidence from source discovery phase.
          
          Output: Section → Sources mapping with reasoning
        output: "section_source_mapping"
        parse_json: true
        timeout: 900
        on_error: "fail"
      
      - id: "create-section-prompts"
        agent: "foundation:zen-architect"
        mode: "ARCHITECT"
        prompt: |
          Create INSTRUCTION-FOCUSED prompts for each section.
          
          Heading structure: {{heading_structure}}
          Section-source mapping: {{section_source_mapping}}
          Document analysis: {{document_analysis}}
          
          **CRITICAL**: Generate prompts that tell HOW to synthesize, NOT WHAT specific content to include.
          
          Prompts should be INSTRUCTION SETS that enable the agent to DISCOVER and SYNTHESIZE
          relevant material from sources. They should NOT prescribe specific content, concepts,
          metaphors, or examples that lock in current source material.
          
          **Core Principle**:
          ```
          Prompts = Instructions for synthesis + Structural templates
          Prompts ≠ Content specifications + Count locks
          
          Structure (HOW to present) = ENCOURAGED ✅
          Content/Count (WHAT/HOW MANY items) = PROHIBITED ❌
          ```
          
          **Key Distinction**:
          
          **TEMPLATES & STRUCTURE** (Encouraged ✅):
          - Table formats, column specifications
          - Section organization patterns
          - Presentation structures (lists, prose, examples)
          - Style and tone requirements
          
          **CONTENT & COUNT LOCKS** (Prohibited ❌):
          - Specific items to include
          - Predetermined numbers ("three principles", "four scenarios")
          - Named concepts/metaphors
          - Exact examples or implementations
          
          **Design Principles**:
          
          1. **Structural Templates Are GOOD**
             ✅ "Create a table covering name, association, and use case for the different scenarios"
                → Specifies TABLE STRUCTURE (columns: name, association, use case)
                → Says "different scenarios" (discovered from sources)
                → Count and content come from source files
             
             ✅ "Present the principles as a numbered list with brief explanations"
                → Specifies PRESENTATION FORMAT (numbered list with explanations)
                → Says "the principles" (discovered from sources)
                → Doesn't lock which or how many principles
             
             ❌ "Create a table for the three scenarios: X, Y, and Z"
                → Locks COUNT ("three")
                → Locks CONTENT (names specific scenarios X, Y, Z)
             
             ❌ "List the four core principles: mechanism vs policy, ruthless simplicity, composability, and observability"
                → Locks COUNT ("four")
                → Locks CONTENT (names specific principles)
          
          2. **Abstract Instructions, Not Content Prescriptions**
             ✅ "Identify the central organizing principle from the philosophy sources"
             ❌ "Include the Linux kernel metaphor as the central organizing principle"
             
             ✅ "Synthesize the key design themes that emerge from the sources"
             ❌ "Include mechanism vs policy, modular design, and ruthless simplicity"
             
             The agent should DISCOVER "Linux kernel metaphor" and "mechanism vs policy" 
             from the sources - not be TOLD to include them.
          
          3. **Conceptual Categories, Not Specific Content**
             ✅ "Explain the discovery mechanism and how it validates sources"
             ❌ "Explain the discover_sources() function from lines 100-115"
             
             ✅ "Describe the architectural principles that guide the design"
             ❌ "Describe mechanism vs policy and separation of concerns"
          
          4. **Structural Guidance, Not Locked Examples**
             ✅ "Include code examples that illustrate the key patterns"
             ✅ "Present each pattern with: name, purpose, example, and use cases"
                → Specifies STRUCTURE for presenting patterns
                → Doesn't lock which patterns or how many
             
             ❌ "Show the ModuleSource class definition from lines 15-25"
             ❌ "Include examples for strategy, observer, and factory patterns"
                → Locks specific patterns
          
          5. **Process Instructions, Not Content Requirements**
             ✅ "Describe how the protocol ensures validity"
             ❌ "Describe the validate_sources() function that checks SOURCE_PATTERNS"
             
             ✅ "Explain the validation approach and its guarantees"
             ❌ "Explain that validation uses regex patterns and file existence checks"
          
          6. **Future-Proof Synthesis Guidance**
             ✅ "Synthesize the core principles from the philosophy sources"
             ✅ "Present each principle with: name, description, and rationale"
                → Specifies STRUCTURE for presenting principles
                → Doesn't lock which principles or how many
             
             ❌ "Include the three principles listed in DESIGN_PHILOSOPHY.md"
                → Locks COUNT ("three")
                → Locks SOURCE location
             
             ✅ "Extract and organize the key themes that appear across sources"
             ✅ "For each theme, provide: definition, examples, and implications"
                → Specifies STRUCTURE for presenting themes
                → Doesn't lock which themes, how many, or ordering
             
             ❌ "Cover theme A, theme B, and theme C in that order"
                → Locks CONTENT (specific themes)
                → Locks COUNT (three themes)
                → Locks ORDER
          
          7. **Context Flow (Good - This Helps Structure)**
             ✅ "Building on the overview from the previous section..."
             ✅ "This sets the foundation for the validation rules section that follows"
          
          **Real-World Example Transformation**:
          
          BEFORE (Too Prescriptive - Locks In Content/Count):
          ```
          Establish the document's purpose and provide a compelling overview of 
          Amplifier's architectural philosophy. Include: (1) High-level statement 
          of Amplifier's design philosophy, (2) The Linux kernel metaphor as 
          central organizing principle, (3) Preview of key themes: mechanism vs 
          policy, modular design, ruthless simplicity, (4) How this philosophy 
          enables AI-native development and regeneration.
          ```
          
          AFTER (Instruction-Focused + Structural Templates):
          ```
          Establish the document's purpose and provide a compelling overview of 
          Amplifier's architectural philosophy.
          
          Include:
          - High-level statement of the design philosophy
          - Identify and explain the central organizing principle
          - Preview the key design themes that emerge from the sources
          - Explain how this philosophy enables AI-native development and regeneration
          
          Style: Engaging and accessible overview
          Tone: Compelling but grounded, suitable for technical readers
          Structure: Clear prose with conceptual progression
          
          Synthesize from the philosophy sources provided.
          ```
          
          Notice: The AFTER version:
          - Lets the agent DISCOVER "Linux kernel metaphor" and "mechanism vs policy" from sources
          - Specifies STRUCTURE (how to present: statement, principle, themes, explanation)
          - Doesn't lock CONTENT (what specific principle or themes)
          - Doesn't lock COUNT (how many themes)
          - If sources evolve, the outline remains valid
          
          **Table Example - Structure vs Content**:
          
          ✅ GOOD (Structural Template):
          ```
          Create a comparison table with columns: Feature, Description, Benefits, Trade-offs.
          Populate with the key features discovered in the sources.
          ```
          → Specifies TABLE STRUCTURE (4 columns with clear purposes)
          → Says "key features discovered" (from sources, not predetermined)
          → Agent determines which features and how many
          
          ❌ BAD (Content/Count Lock):
          ```
          Create a comparison table showing the three features: modularity, 
          composability, and observability, with their descriptions and benefits.
          ```
          → Locks COUNT ("three features")
          → Locks CONTENT (specific features named)
          → Breaks regeneration when sources add/remove/rename features
          
          **Prompt Template Structure**:
          
          Each prompt should follow this structure:
          ```
          [What to accomplish]: Brief description of section purpose
          
          [What to include]:
          - Category of information to synthesize (NOT specific content)
          - Type of explanation needed (NOT exact points to make)
          - Relationships to explore (NOT predetermined connections)
          
          [How to present it] (Structural Templates - ENCOURAGED):
          - Format: [table with columns X, Y, Z | numbered list | prose | code examples]
          - Organization: [comparison table | hierarchical list | conceptual flow]
          - Elements per item: [name + description | title + example + rationale]
          
          [How to write it]:
          - Style: [technical/explanatory/overview/specification]
          - Tone: [accessible/formal/conversational/precise]
          - Structure: [prose/lists/examples/mixed]
          
          [Context]:
          - Previous section: [relationship to previous content]
          - Next section: [what this enables for following content]
          
          Synthesize from the sources provided.
          ```
          
          Note: "How to present it" specifies STRUCTURE (template), which is encouraged.
          It should NOT specify WHAT items or HOW MANY items - those come from sources.
          
          **Required Elements for Each Prompt**:
          
          1. **Section Purpose**: What this section accomplishes (abstract goal)
          2. **Content Categories**: TYPES of information to discover (not specific items)
          3. **Synthesis Instructions**: HOW to analyze and organize (not what to say)
          4. **Presentation Structure**: Templates for HOW to present (encouraged ✅)
             - Table formats with column specifications
             - List structures with element types
             - Organization patterns (comparison, hierarchical, chronological)
          5. **Style Guidance**: How to write (technical/explanatory/etc.)
          6. **Tone Specification**: Voice and audience level
          7. **Context Flow**: Links to previous/next sections
          8. **Generic Source Reference**: "Synthesize from sources" (never specific files/lines)
          
          **Prohibited in Prompts** (STRICT - These Break Regeneration):
          
          ❌ **Content Prescriptions**:
          - Specific metaphors/analogies by name ("Linux kernel metaphor")
          - Specific principles by name ("mechanism vs policy", "ruthless simplicity")
          - Predetermined themes or concepts ("include X, Y, and Z")
          - Exact examples to use ("the git remote example")
          - Specific terminology that may evolve ("bundles", "providers")
          
          ❌ **Count Locks**:
          - Exact counts ("the three principles", "four main points", "five scenarios")
          - Numbered prescriptions ("include (1) X, (2) Y, (3) Z")
          - "All N items" formulations ("all seven patterns")
          
          ❌ **Implementation Locks**:
          - Line numbers (e.g., "lines 45-60")
          - Specific function/class names ("discover_sources()", "ModuleSource")
          - File-specific references ("from DESIGN_PHILOSOPHY.md")
          - Current implementation details ("checks SOURCE_PATTERNS")
          
          ❌ **Content-Specific Ordering**:
          - Predetermined content order ("cover A, then B, then C" where A/B/C are specific items)
          - "First X, then Y, then Z" (when X/Y/Z are named content items)
          - Specific section names from current sources ("the 'Core Concepts' section")
          
          **What IS Allowed** (These Guide Synthesis):
          
          ✅ **Abstract Instructions**:
          - "Identify the central organizing principle"
          - "Synthesize the key design themes"
          - "Explain the validation approach"
          - "Describe the discovery mechanism"
          
          ✅ **Conceptual Categories**:
          - "Architectural principles that guide the design"
          - "Core data structures and their relationships"
          - "Error handling strategy and guarantees"
          - "Integration patterns and extension points"
          
          ✅ **Synthesis Directives**:
          - "Extract and organize the themes that appear across sources"
          - "Identify patterns in how validation is performed"
          - "Compare approaches and synthesize best practices"
          - "Build a coherent explanation from the source material"
          
          ✅ **Structural Templates** (ENCOURAGED):
          - "Create a table with columns: Name, Purpose, Example, Trade-offs"
          - "Present each pattern as: Title, Problem, Solution, Consequences"
          - "Organize as a comparison matrix showing: Feature vs Approach A vs Approach B"
          - "Format as a numbered list with: Principle statement, Explanation, Rationale"
          - "Use a hierarchical structure: Category → Subcategories → Examples"
          - "Present in chronological order: Discovery → Validation → Usage"
          - "Structure each entry with: Definition, Code example, Use cases"
          
          ✅ **Presentation Ordering** (when describing HOW, not WHAT):
          - "Present from most general to most specific"
          - "Organize by conceptual dependency (foundation → building blocks → composition)"
          - "Structure chronologically (lifecycle stages, processing pipeline)"
          - "Order by frequency of use (common patterns first)"
          - These describe HOW to order discovered content, not WHAT specific items to order
          
          **Why This Matters**:
          
          Content-prescriptive prompts break regeneration because:
          1. Sources evolve: "mechanism vs policy" might become "interface vs implementation"
          2. New content appears: A better metaphor might emerge in updated sources
          3. Examples change: Code refactors make specific function names obsolete
          4. Structure shifts: Sections reorganize, making specific references invalid
          
          Instruction-focused prompts enable regeneration because:
          1. They describe WHAT TO LOOK FOR, not what to include
          2. Agent discovers current, relevant content from sources
          3. Outline remains valid as sources evolve
          4. New relevant material is automatically included
          
          **Quality Check**:
          
          For each prompt you generate, ask:
          - "If the source files change, would this prompt still make sense?" (Should be YES)
          - "Does this tell the agent WHAT to find or HOW to synthesize?" (Should be HOW)
          - "Could new relevant material be excluded because of this wording?" (Should be NO)
          - "Am I prescribing content or instructing synthesis?" (Should be INSTRUCTING)
          
          For each section in the heading structure, generate a prompt following 
          these principles. The prompts should guide content synthesis and discovery, 
          not dictate specific content to include.
          
          Output: Prompts for each section (instruction-focused, discovery-enabling, future-proof)
        output: "section_prompts"
        parse_json: true
        timeout: 900
        on_error: "fail"
      
      - id: "build-outline-json"
        agent: "foundation:zen-architect"
        mode: "ARCHITECT"
        prompt: |
          Build the complete outline JSON with EXACT structure matching the example format.
          
          Schema: {{outline_schema}}
          Heading structure: {{heading_structure}}
          Section-source mapping: {{section_source_mapping}}
          Section prompts: {{section_prompts}}
          Current commit: {{current_repo_commit}}
          External repos: {{external_repos_detected}}
          Document metadata: {{document_metadata}}
          Target document: {{normalized_context.target_doc}}
          Document name: {{normalized_context.document_name}}
          
          # ==============================================================================
          # CRITICAL: EXACT STRUCTURE REQUIREMENTS
          # ==============================================================================
          
          **REQUIRED STRUCTURE** (must match example exactly):
          
          ```json
          {
            "_meta": {
              "name": "document-name-outline",
              "document_instruction": "Generate this document based on the source materials...",
              "model": "claude-sonnet-4-20250514",
              "max_response_tokens": 8000,
              "temperature": 0.2
            },
            "document": {
              "title": "# Document Title",
              "output": "path/to/document.md",
              "sections": [
                {
                  "heading": "# Section Title",
                  "level": 1,
                  "prompt": "Prompt for this section...",
                  "sources": [
                    {
                      "file": "https://github.com/org/repo/blob/COMMIT/path/file.md",
                      "reasoning": "This file provides...",
                      "commit": "full-40-char-hash"
                    }
                  ],
                  "sections": [
                    {
                      "heading": "## Subsection Title",
                      "level": 2,
                      "prompt": "Prompt for subsection...",
                      "sources": [...],
                      "sections": []
                    }
                  ]
                }
              ]
            }
          }
          ```
          
          # ==============================================================================
          # CRITICAL FIELD REQUIREMENTS
          # ==============================================================================
          
          **Top Level**:
          - Use `_meta` (with underscore) NOT `meta`
          - Use `document` wrapper
          
          **_meta Fields** (EXACT names required):
          - `name`: "{document-name}-outline" (e.g., "design-philosophy-outline")
          - `document_instruction`: Overall generation guidance
          - `model`: "claude-sonnet-4-20250514"
          - `max_response_tokens`: 8000 (NOT "max_tokens")
          - `temperature`: 0.2
          
          **document Fields**:
          - `title`: Include markdown prefix (e.g., "# Amplifier Design Philosophy")
          - `output`: Full path to target document (e.g., "docs/DESIGN_PHILOSOPHY.md")
          - `sections`: Array of section objects
          
          **Section Fields** (EXACT names required):
          - `heading`: Include markdown prefix based on level
            - Level 1: "# Title"
            - Level 2: "## Title"
            - Level 3: "### Title"
          - `level`: Numeric level (1, 2, 3, etc.)
          - `prompt`: Instruction-focused prompt
          - `sources`: Array of source objects
          - `sections`: Array of nested subsections (NOT "children")
          
          **Source Fields** (EXACT names required):
          - `file`: Full GitHub URL (NOT "url")
          - `reasoning`: Why this source is included
          - `commit`: Full 40-character commit hash
          
          **PROHIBITED FIELDS** (DO NOT include):
          - ❌ `id` field in sections
          - ❌ `title` field (use `heading` instead)
          - ❌ `context` field
          - ❌ `presentation` field
          - ❌ `children` field (use `sections` instead)
          - ❌ `url` field in sources (use `file` instead)
          - ❌ `lines` field in sources
          
          # ==============================================================================
          # HEADING FORMAT REQUIREMENTS
          # ==============================================================================
          
          For each section, include the markdown prefix in the `heading` value:
          
          - Level 1: `"heading": "# Amplifier Design Philosophy"`
          - Level 2: `"heading": "## Core Principles"`
          - Level 3: `"heading": "### Mechanism vs Policy"`
          
          Extract heading text from {{heading_structure}} and prepend the appropriate number of `#` characters based on the level.
          
          # ==============================================================================
          # DOCUMENT NAME EXTRACTION
          # ==============================================================================
          
          Document name: {{normalized_context.document_name}}
          - This was already extracted in Stage 0 (context-validation)
          - Convert to lowercase with hyphens for outline name
          - Use as: `"name": "design-philosophy-outline"`
          
          # ==============================================================================
          # SOURCE URL FORMATTING
          # ==============================================================================
          
          For each source, construct proper GitHub blob URL:
          
          **For current repository files**:
          - Determine GitHub org and repo name
          - Format: `https://github.com/{org}/{repo}/blob/{commit}/{file_path}`
          - Use EXACT commit from {{current_repo_commit}}
          
          **For external repository files**:
          - Extract org/repo from {{external_repos_detected}}
          - Format: `https://github.com/{org}/{repo}/blob/{commit}/{file_path}`
          - Use commit from external repo data
          
          # ==============================================================================
          # EXAMPLE TRANSFORMATION
          # ==============================================================================
          
          **WRONG** (old format):
          ```json
          {
            "meta": {
              "max_tokens": 8000
            },
            "sections": [
              {
                "id": "intro",
                "title": "Introduction",
                "level": 1,
                "sources": [
                  {
                    "url": "path/to/file.md",
                    "lines": "1-50"
                  }
                ],
                "children": []
              }
            ]
          }
          ```
          
          **CORRECT** (required format):
          ```json
          {
            "_meta": {
              "name": "document-outline",
              "max_response_tokens": 8000,
              "document_instruction": "...",
              "model": "claude-sonnet-4-20250514",
              "temperature": 0.2
            },
            "document": {
              "title": "# Document Title",
              "output": "docs/DOCUMENT.md",
              "sections": [
                {
                  "heading": "# Introduction",
                  "level": 1,
                  "prompt": "...",
                  "sources": [
                    {
                      "file": "https://github.com/org/repo/blob/abc123.../path/to/file.md",
                      "reasoning": "...",
                      "commit": "abc123..."
                    }
                  ],
                  "sections": []
                }
              ]
            }
          }
          ```
          
          # ==============================================================================
          # QUALITY CHECKS
          # ==============================================================================
          
          Before finalizing, verify:
          - ✅ Top level has `_meta` and `document` (NOT just `meta` and `sections`)
          - ✅ `_meta` has `max_response_tokens` (NOT `max_tokens`)
          - ✅ `_meta` has `name` field
          - ✅ `document` has `title` with markdown prefix
          - ✅ `document` has `output` with full path
          - ✅ Sections use `heading` with markdown prefix (NOT `title`)
          - ✅ Sections use `sections` for nesting (NOT `children`)
          - ✅ Sources use `file` with full URL (NOT `url`)
          - ✅ No `id`, `context`, `presentation`, or `lines` fields
          - ✅ All commit hashes are full 40-character strings
          - ✅ All headings include markdown prefix (# ## ###)
          
          Generate the complete outline JSON following this EXACT structure.
        output: "outline_json"
        timeout: 900
        on_error: "fail"
      
